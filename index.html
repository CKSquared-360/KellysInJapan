<!--
  JAPAN TRIP — SHOPPING LEDGER + DUTY CALCULATOR
  Drop-in section for your Pokémon Go–themed PWA.
  Persists via localStorage (per-device). Add it as its own tab/section
  wherever you'd like — e.g. next to Food & Stores.
-->

<section id="ledgerApp" style="
  background:#0b1a3a;border:2px solid #d4af37;border-radius:16px;
  padding:20px;color:#f5f5f5;font-family:inherit;max-width:560px;margin:0 auto;
">
  <h2 style="color:#d4af37;text-align:center;margin:0 0 4px;text-shadow:0 0 6px rgba(212,175,55,0.5);">
    🧾 Shopping Ledger &amp; Duty Tracker
  </h2>
  <p style="text-align:center;font-size:13px;color:#aab4d4;margin:0 0 16px;">
    Catch your receipts — every item logged levels up your duty estimate
  </p>

  <!-- SETTINGS -->
  <div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <div style="flex:1 1 120px;">
        <label style="display:block;font-size:11px;color:#aab4d4;margin-bottom:4px;">Travelers (combined exemption)</label>
        <input id="lgTravelers" type="number" min="1" value="3" style="width:100%;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#0e1e42;color:#fff;box-sizing:border-box;">
      </div>
      <div style="flex:1 1 120px;">
        <label style="display:block;font-size:11px;color:#aab4d4;margin-bottom:4px;">¥ per $1 (JPY rate)</label>
        <input id="lgRate" type="number" min="1" step="0.01" value="155" style="width:100%;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#0e1e42;color:#fff;box-sizing:border-box;">
      </div>
    </div>
    <label style="display:block;font-size:11px;color:#aab4d4;margin-bottom:4px;">Traveler names (comma-separated, optional)</label>
    <input id="lgNames" type="text" placeholder="e.g. Corby, Wife, Son" style="width:100%;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#0e1e42;color:#fff;box-sizing:border-box;">
  </div>

  <!-- ADD ITEM -->
  <div style="background:#0e1e42;border:1px solid #d4af37;border-radius:10px;padding:14px;margin-bottom:16px;">
    <h3 style="color:#d4af37;font-size:14px;margin:0 0 10px;">Add Item</h3>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input id="lgItemName" type="text" placeholder="Item name" style="flex:2;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;min-width:0;">
      <select id="lgItemCategory" style="flex:1;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;min-width:0;"></select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input id="lgItemAmount" type="number" min="0" step="1" placeholder="Amount" style="flex:1;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;min-width:0;">
      <select id="lgItemCurrency" style="width:70px;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;">
        <option value="USD">USD</option>
        <option value="JPY" selected>JPY</option>
      </select>
      <select id="lgItemTraveler" style="flex:1;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;min-width:0;">
        <option value="Shared">Shared/Family</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input id="lgItemStore" type="text" placeholder="Store / city (optional)" style="flex:1;padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;min-width:0;">
      <input id="lgItemDate" type="date" style="padding:8px;border-radius:6px;border:1px solid #d4af37;background:#132552;color:#fff;">
    </div>
    <button id="lgAddBtn" style="
      width:100%;padding:11px;border:none;border-radius:10px;
      background:linear-gradient(180deg,#e3352d,#b5231d);color:#fff;
      font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.4);
    ">+ Add to Ledger</button>
  </div>

  <!-- SUMMARY -->
  <div id="lgSummary" style="margin-bottom:16px;"></div>

  <!-- ITEM LIST -->
  <h3 style="color:#d4af37;font-size:14px;margin:0 0 8px;">Items (<span id="lgItemCount">0</span>)</h3>
  <div id="lgItemList" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;"></div>
  <p id="lgEmptyMsg" style="text-align:center;font-size:12px;color:#8a93b8;margin-top:12px;">No items yet — start catching those receipts!</p>
</section>

<script>
(function() {
  const STORAGE_KEY = 'jptLedger_items_v1';
  const SETTINGS_KEY = 'jptLedger_settings_v1';

  const CATEGORIES = [
    { id: 'clothing',    label: 'Clothing / apparel',          rate: 16 },
    { id: 'footwear',    label: 'Footwear',                    rate: 12 },
    { id: 'leather',     label: 'Leather goods / bags',        rate: 10 },
    { id: 'electronics', label: 'Electronics',                 rate: 4  },
    { id: 'toys',        label: 'Toys / games / collectibles', rate: 0  },
    { id: 'cosmetics',   label: 'Cosmetics / beauty',          rate: 0  },
    { id: 'other',       label: 'Other / misc',                rate: 5  }
  ];
  const CAT_COLOR = {
    clothing:'#e3352d', footwear:'#f5a623', leather:'#8e5a3d',
    electronics:'#4aa3ff', toys:'#7fd97f', cosmetics:'#e07fd9', other:'#aab4d4'
  };
  const catLabel = id => (CATEGORIES.find(c => c.id === id) || {}).label || id;
  const catRate  = id => (CATEGORIES.find(c => c.id === id) || {}).rate / 100;

  const fmt = n => '$' + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const todayStr = () => new Date().toISOString().slice(0,10);

  // ---------- persistence ----------
  function loadItems() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      travelers: document.getElementById('lgTravelers').value,
      rate: document.getElementById('lgRate').value,
      names: document.getElementById('lgNames').value
    }));
  }

  let items = loadItems();
  const settings = loadSettings();
  if (settings.travelers) document.getElementById('lgTravelers').value = settings.travelers;
  if (settings.rate) document.getElementById('lgRate').value = settings.rate;
  if (settings.names) document.getElementById('lgNames').value = settings.names;
  document.getElementById('lgItemDate').value = todayStr();

  // ---------- populate category + traveler dropdowns ----------
  const catSelect = document.getElementById('lgItemCategory');
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.label;
    catSelect.appendChild(opt);
  });

  function refreshTravelerOptions() {
    const select = document.getElementById('lgItemTraveler');
    const current = select.value;
    const names = document.getElementById('lgNames').value
      .split(',').map(s => s.trim()).filter(Boolean);
    select.innerHTML = '<option value="Shared">Shared/Family</option>';
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      select.appendChild(opt);
    });
    if ([...select.options].some(o => o.value === current)) select.value = current;
  }
  document.getElementById('lgNames').addEventListener('input', () => { refreshTravelerOptions(); saveSettings(); });
  document.getElementById('lgTravelers').addEventListener('input', () => { saveSettings(); render(); });
  document.getElementById('lgRate').addEventListener('input', () => { saveSettings(); render(); });
  refreshTravelerOptions();

  // ---------- add item ----------
  document.getElementById('lgAddBtn').addEventListener('click', function() {
    const name = document.getElementById('lgItemName').value.trim();
    const category = document.getElementById('lgItemCategory').value;
    const rawAmount = parseFloat(document.getElementById('lgItemAmount').value);
    const currency = document.getElementById('lgItemCurrency').value;
    const traveler = document.getElementById('lgItemTraveler').value;
    const store = document.getElementById('lgItemStore').value.trim();
    const date = document.getElementById('lgItemDate').value || todayStr();

    if (!name || !rawAmount || rawAmount <= 0) {
      alert('Enter an item name and a valid amount.');
      return;
    }
    const rate = parseFloat(document.getElementById('lgRate').value) || 155;
    const amountUSD = currency === 'JPY' ? rawAmount / rate : rawAmount;

    items.push({
      id: Date.now() + Math.random().toString(36).slice(2,7),
      name, category, currency, rawAmount, amountUSD, traveler, store, date
    });
    saveItems(items);

    document.getElementById('lgItemName').value = '';
    document.getElementById('lgItemAmount').value = '';
    document.getElementById('lgItemStore').value = '';

    render();
  });

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems(items);
    render();
  }

  // ---------- duty engine ----------
  // Mirrors real CBP practice: your combined exemption is applied to the
  // highest-duty items first, then the flat-3% bracket, then remaining
  // items pay their own category rate.
  function computeDuty(travelers) {
    const exemptionTotal = travelers * 800;
    const flatBracketTotal = travelers * 1000;

    const sorted = [...items].sort((a, b) => catRate(b.category) - catRate(a.category));

    let exemptionLeft = exemptionTotal;
    let flatLeft = flatBracketTotal;
    let exemptUsed = 0, flatTaxed = 0, flatDuty = 0, excessTaxed = 0, excessDuty = 0;

    sorted.forEach(item => {
      let amt = item.amountUSD;

      const useExempt = Math.min(amt, exemptionLeft);
      exemptionLeft -= useExempt; amt -= useExempt; exemptUsed += useExempt;

      if (amt > 0) {
        const useFlat = Math.min(amt, flatLeft);
        flatLeft -= useFlat; amt -= useFlat;
        flatTaxed += useFlat; flatDuty += useFlat * 0.03;
      }
      if (amt > 0) {
        excessTaxed += amt;
        excessDuty += amt * catRate(item.category);
      }
    });

    return {
      exemptionTotal, flatBracketTotal,
      exemptUsed, flatTaxed, flatDuty, excessTaxed, excessDuty,
      totalDuty: flatDuty + excessDuty,
      totalSpent: items.reduce((s, i) => s + i.amountUSD, 0)
    };
  }

  // ---------- render ----------
  function render() {
    const travelers = Math.max(1, parseInt(document.getElementById('lgTravelers').value) || 1);
    const d = computeDuty(travelers);

    // category totals
    const catTotals = {};
    items.forEach(i => { catTotals[i.category] = (catTotals[i.category] || 0) + i.amountUSD; });

    // traveler totals
    const travTotals = {};
    items.forEach(i => { travTotals[i.traveler] = (travTotals[i.traveler] || 0) + i.amountUSD; });

    const catRows = Object.entries(catTotals)
      .sort((a,b) => b[1]-a[1])
      .map(([cat, amt]) => `
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#cfd6ee;padding:3px 0;">
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLOR[cat]||'#aab4d4'};margin-right:6px;"></span>${catLabel(cat)}</span>
          <span>${fmt(amt)}</span>
        </div>`).join('');

    const travRows = Object.entries(travTotals)
      .sort((a,b) => b[1]-a[1])
      .map(([t, amt]) => `
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#cfd6ee;padding:3px 0;">
          <span>${t}</span><span>${fmt(amt)}</span>
        </div>`).join('');

    document.getElementById('lgSummary').innerHTML = `
      <div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#f5d76e;font-weight:700;">
          <span>Total logged</span><span>${fmt(d.totalSpent)}</span>
        </div>
      </div>

      ${catRows ? `<div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="font-size:11px;color:#aab4d4;margin-bottom:6px;">By category</div>${catRows}
      </div>` : ''}

      ${travRows ? `<div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="font-size:11px;color:#aab4d4;margin-bottom:6px;">By traveler</div>${travRows}
      </div>` : ''}

      <div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#aab4d4;">
          <span>Duty-free exemption ($800 × ${travelers})</span>
          <span style="color:#7fd97f;font-weight:700;">${fmt(d.exemptionTotal)} avail. — ${fmt(d.exemptUsed)} used</span>
        </div>
      </div>
      <div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#aab4d4;">
          <span>Flat 3% bracket ($1,000 × ${travelers})</span>
          <span style="color:#f5d76e;">${fmt(d.flatTaxed)} taxed → ${fmt(d.flatDuty)} duty</span>
        </div>
      </div>
      ${d.excessTaxed > 0 ? `
      <div style="background:#132552;border-radius:10px;padding:12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#aab4d4;">
          <span>Above flat bracket (category rates)</span>
          <span style="color:#e3352d;">${fmt(d.excessTaxed)} taxed → ${fmt(d.excessDuty)} duty</span>
        </div>
      </div>` : ''}

      <div style="background:linear-gradient(90deg,#d4af37,#f5d76e);color:#0b1a3a;border-radius:10px;padding:14px;text-align:center;font-weight:800;font-size:16px;">
        Estimated duty owed: ${fmt(d.totalDuty)}
      </div>
    `;

    // item list
    const listEl = document.getElementById('lgItemList');
    listEl.innerHTML = '';
    const sortedForDisplay = [...items].sort((a,b) => new Date(b.date) - new Date(a.date));
    sortedForDisplay.forEach(item => {
      const card = document.createElement('div');
      card.style.cssText = `background:#132552;border-left:4px solid ${CAT_COLOR[item.category]||'#aab4d4'};border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;`;
      const originalStr = item.currency === 'JPY'
        ? `¥${Math.round(item.rawAmount).toLocaleString()}`
        : fmt(item.rawAmount);
      card.innerHTML = `
        <div>
          <div style="font-size:13px;font-weight:600;color:#fff;">${escapeHtml(item.name)}</div>
          <div style="font-size:11px;color:#8a93b8;">${catLabel(item.category)} · ${item.traveler} · ${item.date}${item.store ? ' · ' + escapeHtml(item.store) : ''}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px;font-weight:700;color:#f5d76e;">${fmt(item.amountUSD)}</div>
          <div style="font-size:10px;color:#8a93b8;">${originalStr}</div>
        </div>
        <button data-id="${item.id}" class="lgDeleteBtn" style="background:none;border:none;color:#e3352d;font-size:16px;cursor:pointer;margin-left:10px;">✕</button>
      `;
      listEl.appendChild(card);
    });

    document.querySelectorAll('.lgDeleteBtn').forEach(btn => {
      btn.addEventListener('click', () => deleteItem(btn.getAttribute('data-id')));
    });

    document.getElementById('lgItemCount').textContent = items.length;
    document.getElementById('lgEmptyMsg').style.display = items.length ? 'none' : 'block';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
})();
</script>
