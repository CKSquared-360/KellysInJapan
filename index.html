<style>
/* ═══════════════════════════════════════════
   JAPAN 2026 — POKÉMON GO THEME
═══════════════════════════════════════════ */

:root {
  /* PGo palette */
  --sky:        #0d1b4b;
  --sky2:       #162259;
  --sky3:       #1e2f7a;
  --pokered:    #cc0000;
  --pokered2:   #ff1a1a;
  --yellow:     #ffd700;
  --yellow2:    #ffe566;
  --white:      #ffffff;
  --card-bg:    #f0f4ff;
  --card-bg2:   #e8eeff;
  --border:     #c8d4f8;
  --muted:      #6b7fc4;
  --caught:     #1fa86b;
  --caught-bg:  #e6f9f0;
  --caught-border: #7ddbb0;
  --rare:       #a855f7;
  --rare-bg:    #f5eeff;
  --pokeball-white: #f5f5f5;

  /* city colors — kept vivid */
  --tokyo:      #2979ff;
  --hakone:     #00c853;
  --osaka:      #d500f9;
  --kyoto:      #ff1744;
  --nara:       #ff9100;
  --kobe:       #00b0ff;
  --awaji:      #ff6d00;

  --radius:     14px;
  --radius-sm:  8px;
  --radius-pill:50px;
  --shadow:     0 2px 16px rgba(13,27,75,.13);
  --shadow-glow:0 0 16px rgba(255,215,0,.25);
  --nav-h:      68px;
  --header-h:   56px;
  --safe-bottom:env(safe-area-inset-bottom,0px);

  /* per-tab Pokémon type theme — set dynamically by JS on navigate */
  --active-type-color: var(--yellow);
  --active-type-glow:  rgba(255,215,0,.4);
  --nav-bg-top:    #0a1540;
  --nav-bg-bottom: #070e2e;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--sky);
  color:#1a1f3a;
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit}

/* ── SHELL ── */
.app-shell{
  display:flex;flex-direction:column;
  height:100dvh;max-width:430px;
  margin:0 auto;background:var(--sky);
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.4);
}

/* ── HEADER ── */
.app-header{
  height:var(--header-h);
  background:linear-gradient(135deg,var(--pokered) 0%,#990000 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;flex-shrink:0;
  border-bottom:3px solid var(--yellow);
  position:relative;z-index:10;
  box-shadow:0 2px 20px rgba(204,0,0,.5);
}
.app-header::after{
  content:'';position:absolute;bottom:-3px;left:0;right:0;
  height:3px;background:linear-gradient(90deg,var(--yellow),var(--yellow2),var(--yellow));
}
.app-header-title{display:flex;align-items:center;gap:10px}
.pokeball-icon{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(180deg,var(--pokered2) 50%,var(--pokeball-white) 50%);
  border:2px solid white;position:relative;flex-shrink:0;
  box-shadow:0 0 8px rgba(255,255,255,.4);
}
.pokeball-icon::after{
  content:'';position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;
  background:white;border:2px solid #ccc;
}
.app-header-title h1{
  font-size:1.1rem;font-weight:900;
  color:var(--white);letter-spacing:.03em;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}
.app-header-title .jp{
  font-family:'Noto Serif JP',serif;
  font-size:.75rem;color:var(--yellow);
  opacity:.9;font-weight:700;
}
.app-header-meta{
  font-size:.6rem;color:rgba(255,255,255,.7);
  letter-spacing:.06em;text-transform:uppercase;
  text-align:right;line-height:1.5;
}
.install-btn{
  background:var(--yellow);color:var(--pokered);
  font-size:.65rem;font-weight:900;padding:5px 11px;
  border-radius:var(--radius-pill);letter-spacing:.04em;
  display:none;border:2px solid white;
  text-transform:uppercase;
}
.install-btn.visible{display:block}

/* ── CONTENT ── */
.content-area{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
.screens-wrap{flex:1;position:relative;overflow:hidden;min-height:0}

/* ── PER-TAB POKÉMON TYPE THEMES ──
   Each type overrides the app's core palette variables (--sky family,
   --card-bg family, --border, --muted) so EVERY component that already
   reads them — day-cards, banners, forms, links, popups, badges — shifts
   color automatically. The screen-level background-image adds a bold
   decorative texture layer on top. */

/* Grass — Route */
.app-shell[data-type="grass"]{
  --sky:#0b2b1a; --sky2:#123a22; --sky3:#2f8a4e;
  --card-bg:#eafbf0; --card-bg2:#d7f2e0; --border:#7fd39e; --muted:#3f7a58;
  --active-type-color:#4cd97b; --active-type-glow:rgba(76,217,123,.55);
  --nav-bg-top:#0e3320; --nav-bg-bottom:#081f14;
}
.app-shell[data-type="grass"] .screens-wrap .screen.active{
  background-image:
    linear-gradient(135deg, transparent 50%, rgba(255,255,255,.16) 50%),
    linear-gradient(225deg, transparent 50%, rgba(255,255,255,.16) 50%),
    repeating-linear-gradient(65deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 2px, transparent 2px, transparent 22px),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-position: left bottom, 9px bottom, 0 0, 0 0;
  background-size: 22px 34px, 22px 34px, auto, 100% 100%;
  background-repeat: repeat-x, repeat-x, repeat, no-repeat;
}

/* Flying — Travel */
.app-shell[data-type="flying"]{
  --sky:#0c2347; --sky2:#12315e; --sky3:#3f8fd6;
  --card-bg:#eaf5ff; --card-bg2:#d7ebff; --border:#8fc3ee; --muted:#3f6f96;
  --active-type-color:#8ecae6; --active-type-glow:rgba(142,202,230,.55);
  --nav-bg-top:#0e2c56; --nav-bg-bottom:#081a36;
}
.app-shell[data-type="flying"] .screens-wrap .screen.active{
  background-image:
    radial-gradient(ellipse 100px 44px at 15% 14%, rgba(255,255,255,.30), transparent 70%),
    radial-gradient(ellipse 130px 54px at 68% 8%, rgba(255,255,255,.24), transparent 70%),
    radial-gradient(ellipse 90px 40px at 38% 30%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(ellipse 140px 58px at 88% 42%, rgba(255,255,255,.20), transparent 70%),
    radial-gradient(ellipse 110px 46px at 22% 62%, rgba(255,255,255,.14), transparent 70%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

/* Poké Ball — Catch (kept close to original brand look) */
.app-shell[data-type="pokeball"]{
  --sky:#0d1b4b; --sky2:#162259; --sky3:#1e2f7a;
  --card-bg:#f0f4ff; --card-bg2:#e8eeff; --border:#c8d4f8; --muted:#6b7fc4;
  --active-type-color:#ffd700; --active-type-glow:rgba(255,215,0,.4);
  --nav-bg-top:#0a1540; --nav-bg-bottom:#070e2e;
}
.app-shell[data-type="pokeball"] .screens-wrap .screen.active{
  background-image:
    radial-gradient(circle, rgba(255,255,255,.07) 2.5px, transparent 3px),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-size: 28px 28px, 100% 100%;
  background-position: 0 0, 0 0;
  background-repeat: repeat, no-repeat;
}

/* Fire — Food (Arcanine) */
.app-shell[data-type="fire"]{
  --sky:#3a0f05; --sky2:#5c1907; --sky3:#e8781f;
  --card-bg:#fff2e6; --card-bg2:#ffdfc2; --border:#f3ad6e; --muted:#95491a;
  --active-type-color:#ff8c1a; --active-type-glow:rgba(255,140,26,.55);
  --nav-bg-top:#3d1206; --nav-bg-bottom:#210903;
}
.app-shell[data-type="fire"] .screens-wrap .screen.active{
  background-image:
    radial-gradient(circle 8px at 18% 88%, rgba(255,210,140,.7), transparent 70%),
    radial-gradient(circle 5px at 52% 94%, rgba(255,170,80,.6), transparent 70%),
    radial-gradient(circle 7px at 78% 84%, rgba(255,150,40,.65), transparent 70%),
    radial-gradient(circle 4px at 33% 76%, rgba(255,190,110,.5), transparent 70%),
    linear-gradient(135deg, transparent 50%, rgba(255,140,26,.35) 50%),
    linear-gradient(225deg, transparent 50%, rgba(255,140,26,.35) 50%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-position: 0 0, 0 0, 0 0, 0 0, left bottom, 13px bottom, 0 0;
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 26px 36px, 26px 36px, 100% 100%;
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat-x, repeat-x, no-repeat;
}

/* Electric — Quest (Pikachu) */
.app-shell[data-type="electric"]{
  --sky:#2b2405; --sky2:#3d3407; --sky3:#c9ab0a;
  --card-bg:#fffbe0; --card-bg2:#fff2a8; --border:#e8d34a; --muted:#8a7a1f;
  --active-type-color:#fbe10b; --active-type-glow:rgba(251,225,11,.6);
  --nav-bg-top:#2e2705; --nav-bg-bottom:#191502;
}
.app-shell[data-type="electric"] .screens-wrap .screen.active{
  background-image:
    repeating-linear-gradient(115deg, rgba(255,240,80,.20) 0px, rgba(255,240,80,.20) 4px, transparent 4px, transparent 30px),
    repeating-linear-gradient(65deg, rgba(255,240,80,.14) 0px, rgba(255,240,80,.14) 3px, transparent 3px, transparent 40px),
    radial-gradient(circle 3px at 25% 30%, rgba(255,255,255,.5), transparent 70%),
    radial-gradient(circle 3px at 70% 60%, rgba(255,255,255,.4), transparent 70%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat;
}

/* Psychic — Translate */
.app-shell[data-type="psychic"]{
  --sky:#2a0c3d; --sky2:#3a1150; --sky3:#a860d6;
  --card-bg:#fbeeff; --card-bg2:#f0d8ff; --border:#d3a0ec; --muted:#7a4a99;
  --active-type-color:#d67cf0; --active-type-glow:rgba(214,124,240,.55);
  --nav-bg-top:#2f0e44; --nav-bg-bottom:#190726;
}
.app-shell[data-type="psychic"] .screens-wrap .screen.active{
  background-image:
    repeating-radial-gradient(circle at 28% 22%, rgba(255,255,255,.14) 0px, rgba(255,255,255,.14) 2px, transparent 2px, transparent 20px),
    repeating-radial-gradient(circle at 76% 68%, rgba(255,255,255,.12) 0px, rgba(255,255,255,.12) 2px, transparent 2px, transparent 26px),
    radial-gradient(ellipse 160px 90px at 50% 45%, rgba(214,124,240,.20), transparent 70%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
}

/* Steel — Customs */
.app-shell[data-type="steel"]{
  --sky:#1c222b; --sky2:#262d38; --sky3:#8496a8;
  --card-bg:#eef1f4; --card-bg2:#d9dfe5; --border:#aebbc7; --muted:#4c5764;
  --active-type-color:#c7d3e0; --active-type-glow:rgba(199,211,224,.55);
  --nav-bg-top:#20272f; --nav-bg-bottom:#12161b;
}
.app-shell[data-type="steel"] .screens-wrap .screen.active{
  background-image:
    repeating-linear-gradient(100deg, rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 1.5px, transparent 1.5px, transparent 12px),
    radial-gradient(circle 2.5px at 15% 20%, rgba(255,255,255,.35), transparent 70%),
    radial-gradient(circle 2.5px at 80% 30%, rgba(255,255,255,.3), transparent 70%),
    radial-gradient(circle 2.5px at 40% 70%, rgba(255,255,255,.32), transparent 70%),
    radial-gradient(circle 2.5px at 65% 85%, rgba(255,255,255,.3), transparent 70%),
    radial-gradient(circle 2.5px at 90% 60%, rgba(255,255,255,.28), transparent 70%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
}

/* Ghost — Alerts (Ghastly) */
.app-shell[data-type="ghost"]{
  --sky:#130a1f; --sky2:#1c0f2e; --sky3:#7a3fa8;
  --card-bg:#efe4fa; --card-bg2:#ddc8f2; --border:#b98fe0; --muted:#5c3a7a;
  --active-type-color:#9b59d0; --active-type-glow:rgba(155,89,208,.6);
  --nav-bg-top:#170b24; --nav-bg-bottom:#0c0614;
}
.app-shell[data-type="ghost"] .screens-wrap .screen.active{
  background-image:
    radial-gradient(ellipse 150px 76px at 20% 25%, rgba(155,89,208,.30), transparent 70%),
    radial-gradient(ellipse 170px 86px at 78% 18%, rgba(120,60,170,.26), transparent 70%),
    radial-gradient(ellipse 130px 66px at 50% 72%, rgba(140,80,190,.28), transparent 70%),
    radial-gradient(ellipse 110px 56px at 88% 82%, rgba(155,89,208,.22), transparent 70%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
  background-repeat: no-repeat;
}

/* ── SCREENS ── */
.screen{
  position:absolute;inset:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:10px 10px calc(var(--nav-h) + var(--safe-bottom) + 10px);
  display:none;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}

/* ── BOTTOM NAV ── */
.bottom-nav::-webkit-scrollbar{display:none;width:0;height:0}
.bottom-nav{
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:linear-gradient(180deg,var(--nav-bg-top) 0%,var(--nav-bg-bottom) 100%);
  border-top:2px solid rgba(255,215,0,.3);
  display:flex;align-items:stretch;flex-shrink:0;z-index:20;
  overflow-x:scroll;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.bottom-nav::-webkit-scrollbar{display:none;}
.nav-btn{
  flex:0 0 68px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;padding:4px 2px;
  color:rgba(255,255,255,.35);transition:color .15s;
  position:relative;
  scroll-snap-align:start;
}
.nav-btn.active{color:var(--active-type-color)}
.nav-btn.active .nav-label{color:var(--active-type-color)}
.nav-btn.active::before{
  content:'';position:absolute;
  top:0;left:20%;right:20%;height:2px;
  background:var(--active-type-color);
  border-radius:0 0 3px 3px;
  box-shadow:0 0 8px var(--active-type-color);
}
.nav-btn.active .nav-icon{filter:drop-shadow(0 0 5px var(--active-type-color));transition:filter .2s;}
.nav-icon{font-size:1.15rem;line-height:1;transition:filter .2s;}
.nav-label{font-size:.54rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.nav-badge{
  position:absolute;top:5px;right:14%;
  background:var(--pokered2);color:#fff;
  font-size:.5rem;font-weight:900;
  min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:1.5px solid white;
  box-shadow:0 0 6px rgba(255,26,26,.6);
}

/* ── SECTION TITLE ── */
.section-title{
  font-size:.65rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--active-type-color);
  margin-bottom:8px;padding:0 2px;
  text-shadow:0 0 10px var(--active-type-glow);
  transition:color .2s,text-shadow .2s;
}

/* ── TYPE INDICATOR BAR ── */
.type-indicator{
  font-size:.56rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;text-align:center;
  padding:5px 8px;flex-shrink:0;
  color:var(--active-type-color);
  background:rgba(0,0,0,.25);
  border-bottom:1px solid var(--active-type-color);
  transition:color .2s,border-color .2s;
}

/* ── POKÉDEX CARDS (Day Cards) ── */
.day-card{
  background:var(--card-bg);
  border:2px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;
  box-shadow:var(--shadow);
  transition:box-shadow .15s,transform .1s;
  position:relative;
}
.day-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--city-color,#2979ff),transparent);
  opacity:.6;
}
.day-card.has-tickets{
  border-color:var(--caught-border);
  box-shadow:0 2px 16px rgba(31,168,107,.2);
}
.day-card.has-tickets::before{
  background:linear-gradient(90deg,var(--caught),transparent);
  opacity:1;
}

.day-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(240,244,255,.95));
}
.day-num{
  font-size:.58rem;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;
  border-radius:var(--radius-sm);padding:3px 7px;flex-shrink:0;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.day-date{font-size:.78rem;font-weight:700;color:#1a1f3a;flex:1;line-height:1.2}
.day-city-tag{font-size:.6rem;color:var(--muted);white-space:nowrap;font-weight:600}
.day-chevron{font-size:.75rem;color:var(--border);transition:transform .2s;flex-shrink:0}
.day-card.expanded .day-chevron{transform:rotate(180deg)}

/* ticket chips on cards */
.day-ticket-bar{
  padding:4px 12px 8px;
  display:flex;flex-wrap:wrap;gap:4px;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(240,244,255,.95));
}
.ticket-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--caught-bg);color:var(--caught);
  font-size:.58rem;font-weight:800;
  padding:2px 8px;border-radius:var(--radius-pill);
  border:1.5px solid var(--caught-border);
  text-transform:uppercase;letter-spacing:.04em;
}
.ticket-chip::before{content:'✓ '}
.ticket-chip.pending{
  background:rgba(255,215,0,.15);color:#b8860b;
  border-color:var(--yellow);
}
.ticket-chip.pending::before{content:'⏳ '}

/* card body */
.day-body{
  display:none;
  border-top:1.5px solid var(--border);
  background:rgba(255,255,255,.97);
}
.day-card.expanded .day-body{display:block}

.travel-banner{
  background:linear-gradient(135deg,#1a237e,#283593);
  border-radius:0;padding:8px 12px;
  font-size:.68rem;color:#e8eaf6;line-height:1.5;
  border-left:4px solid var(--yellow);
}

/* stop rows */
.stop-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 12px;border-bottom:1px solid rgba(200,212,248,.5);
  -webkit-tap-highlight-color:transparent;
  background:transparent;transition:background .1s;
}
.stop-row:last-child{border-bottom:none}
.stop-row:active{background:rgba(200,212,248,.3)}
.stop-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
  margin-top:4px;box-shadow:0 0 6px currentColor;
}
.stop-name{font-size:.77rem;font-weight:700;color:#1a1f3a;line-height:1.3}
.stop-note{font-size:.66rem;color:#4a5280;line-height:1.35;margin-top:2px}
.stop-tip{
  font-size:.63rem;color:var(--pokered);
  margin-top:3px;line-height:1.35;font-weight:600;
}
.stop-tip::before{content:'⚡ '}
.stop-booked-tag{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--caught-bg);color:var(--caught);
  font-size:.58rem;font-weight:800;
  padding:2px 8px;border-radius:var(--radius-pill);
  border:1px solid var(--caught-border);
  margin-top:3px;text-transform:uppercase;letter-spacing:.03em;
}

/* ── FLIGHT CARDS ── */
.flight-group-label{
  font-size:.6rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--yellow);
  margin:12px 0 6px;text-shadow:0 0 8px rgba(255,215,0,.3);
}
.flight-card{
  background:var(--card-bg);border:2px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.flight-card.confirmed{border-color:var(--caught-border);box-shadow:0 2px 12px rgba(31,168,107,.15)}
.flight-card.needs-confirm{border-color:rgba(255,215,0,.5);box-shadow:0 2px 12px rgba(255,215,0,.1)}
.fc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fc-label-badge{
  font-size:.58rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);
}
.fc-label-badge.intl{background:var(--sky3);color:var(--yellow)}
.fc-label-badge.dom{background:var(--rare-bg);color:var(--rare)}
.fc-confirmed-badge{
  font-size:.6rem;font-weight:800;color:var(--caught);
  background:var(--caught-bg);padding:2px 8px;
  border-radius:var(--radius-pill);border:1px solid var(--caught-border);
}
.fc-route{font-size:1rem;font-weight:900;color:#1a1f3a;letter-spacing:.01em;margin-bottom:4px}
.fc-date{font-size:.72rem;font-weight:700;color:#1a1f3a;margin-bottom:3px}
.fc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.64rem;color:var(--muted)}
.fc-note{font-size:.64rem;color:var(--muted);margin-top:6px;line-height:1.4;padding-top:6px;border-top:1px solid var(--border)}
.fc-note.warn{color:var(--pokered);font-weight:600}
.flight-timing-alert{
  background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.3);
  border-left:3px solid var(--pokered);border-radius:var(--radius-sm);
  padding:10px 12px;margin-bottom:12px;
  font-size:.68rem;color:#8b0000;line-height:1.5;
}

/* ── HOTEL CARDS ── */
.hotel-card{
  background:var(--card-bg);border:2px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.hotel-nights-badge{
  font-size:.58rem;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:#fff;
  border-radius:var(--radius-pill);padding:3px 10px;
  display:inline-block;margin-bottom:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hotel-name{font-size:.85rem;font-weight:800;color:#1a1f3a;margin-bottom:2px}
.hotel-sub{font-size:.67rem;color:var(--muted);margin-bottom:5px;font-weight:600}
.hotel-note{font-size:.68rem;color:#4a5280;line-height:1.45}
.hotel-cut{
  background:rgba(204,0,0,.06);border:1.5px solid rgba(204,0,0,.2);
  border-radius:var(--radius);padding:11px;margin-top:4px;
}

/* ── POKÉDEX TICKET ITEMS ── */
.tickets-intro{
  background:linear-gradient(135deg,var(--sky3),#1a237e);
  border:1.5px solid rgba(255,215,0,.3);
  border-radius:var(--radius);padding:12px;margin-bottom:12px;
  font-size:.69rem;color:#c5caf5;line-height:1.5;
}
.tickets-intro strong{color:var(--yellow)}

/* XP progress bar */
.xp-bar-wrap{
  background:rgba(255,255,255,.1);border-radius:var(--radius-pill);
  height:10px;margin-bottom:14px;overflow:hidden;
  border:1px solid rgba(255,215,0,.2);
}
.xp-bar-fill{
  background:linear-gradient(90deg,var(--caught),#34d399);
  height:100%;border-radius:var(--radius-pill);
  transition:width .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 8px rgba(31,168,107,.5);
}
.xp-summary{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:0 2px;
}
.xp-label{font-size:.72rem;font-weight:800;color:var(--yellow)}
.xp-sub{font-size:.65rem;color:rgba(255,255,255,.5)}

.urgency-section-label{
  font-size:.6rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;margin:10px 0 6px;
  padding:4px 8px;border-radius:var(--radius-sm);
  display:inline-block;
}
.urgency-section-label.high{background:rgba(204,0,0,.15);color:#ff6b6b}
.urgency-section-label.med{background:rgba(255,215,0,.15);color:var(--yellow)}
.urgency-section-label.low{background:rgba(31,168,107,.15);color:#34d399}

.bookable-item{
  background:var(--card-bg);border:2px solid var(--border);
  border-radius:var(--radius);margin-bottom:8px;overflow:hidden;
  box-shadow:var(--shadow);transition:box-shadow .15s;
}
.bookable-item.booked{
  border-color:var(--caught-border);
  box-shadow:0 2px 16px rgba(31,168,107,.2);
}
.bookable-item.expanded{box-shadow:0 4px 24px rgba(13,27,75,.2)}

.bi-header{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(240,244,255,.95));
}
.bi-icon{font-size:1.4rem;flex-shrink:0}
.bi-info{flex:1;min-width:0}
.bi-name{font-size:.8rem;font-weight:800;color:#1a1f3a}
.bi-day{font-size:.62rem;color:var(--muted);margin-top:1px;font-weight:600}
.bi-status{
  font-size:.58rem;font-weight:800;
  padding:3px 9px;border-radius:var(--radius-pill);
  flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;
}
.bi-status.booked{background:var(--caught-bg);color:var(--caught);border:1px solid var(--caught-border)}
.bi-status.unbooked{background:rgba(200,212,248,.5);color:var(--muted)}
.bi-urgency-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.urgency-high{background:var(--pokered2);box-shadow:0 0 6px rgba(255,26,26,.5)}
.urgency-med{background:var(--yellow);box-shadow:0 0 6px rgba(255,215,0,.5)}
.urgency-low{background:#34d399;box-shadow:0 0 6px rgba(52,211,153,.5)}

.bi-body{
  display:none;padding:12px;
  border-top:1.5px solid var(--border);
  background:rgba(255,255,255,.98);
}
.bookable-item.expanded .bi-body{display:block}

.bi-instructions{
  font-size:.68rem;color:#4a5280;line-height:1.5;
  margin-bottom:10px;background:var(--card-bg2);
  border-radius:var(--radius-sm);padding:8px 10px;
  border-left:3px solid var(--sky3);
}
.bi-link{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--sky),var(--sky3));
  color:var(--yellow);font-size:.68rem;font-weight:800;
  padding:7px 14px;border-radius:var(--radius-pill);
  margin-bottom:12px;border:1.5px solid rgba(255,215,0,.3);
  text-transform:uppercase;letter-spacing:.04em;
}

/* ticket form */
.ticket-form{display:flex;flex-direction:column;gap:8px}
.form-row{display:flex;flex-direction:column;gap:3px}
.form-label{
  font-size:.6rem;font-weight:800;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;
}
.form-input{
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:.78rem;color:#1a1f3a;
  background:var(--card-bg);width:100%;transition:border-color .15s;
}
.form-input:focus{outline:none;border-color:var(--sky3);box-shadow:0 0 0 3px rgba(30,47,122,.1)}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-actions{display:flex;gap:8px;margin-top:4px}
.btn-save{
  flex:1;
  background:linear-gradient(135deg,var(--pokered),#990000);
  color:#fff;font-size:.75rem;font-weight:900;
  padding:10px;border-radius:var(--radius-pill);
  letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(204,0,0,.3);
  border:1.5px solid rgba(255,255,255,.2);
}
.btn-save::before{content:'⚡ '}
.btn-clear{
  background:rgba(204,0,0,.1);color:var(--pokered);
  font-size:.75rem;font-weight:800;
  padding:10px 14px;border-radius:var(--radius-pill);
  border:1.5px solid rgba(204,0,0,.3);
}
.saved-ticket-display{
  background:var(--caught-bg);border:1.5px solid var(--caught-border);
  border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;
}
.std-label{
  font-size:.58rem;font-weight:900;color:var(--caught);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;
}
.std-row{display:flex;justify-content:space-between;font-size:.7rem;color:#2d5a45;margin-top:3px}
.std-val{font-weight:800;color:var(--caught)}

/* ── LINKS ── */
.link-section-label{
  font-size:.6rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--yellow);
  margin:12px 0 6px;text-shadow:0 0 8px rgba(255,215,0,.3);
}
.link-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:var(--card-bg);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:5px;box-shadow:var(--shadow);
  cursor:pointer;transition:background .1s;
  -webkit-tap-highlight-color:transparent;
}
.link-item:active{background:var(--card-bg2)}
.link-item.urgent{border-left:3px solid var(--pokered)}
.link-name{font-size:.75rem;font-weight:700;color:#1a1f3a}
.link-desc{font-size:.62rem;color:var(--muted);margin-top:1px}
.link-arr{font-size:.9rem;color:var(--border)}

/* ── ALERTS ── */
.alert-card{
  background:var(--card-bg);border:1.5px solid var(--border);
  border-left:3px solid var(--pokered);
  border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:7px;
  box-shadow:var(--shadow);
}
.alert-card.info{border-left-color:var(--yellow)}
.alert-title{font-size:.76rem;font-weight:800;color:#1a1f3a;margin-bottom:3px}
.alert-body{font-size:.66rem;color:#4a5280;line-height:1.45}
.alert-section-label{
  font-size:.6rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;margin:4px 0 7px;display:block;
  color:#ff6b6b;text-shadow:0 0 8px rgba(255,26,26,.3);
}
.alert-section-label.soon{color:var(--yellow);text-shadow:0 0 8px rgba(255,215,0,.3);margin-top:14px}

/* ── MAP ── */
.map-screen{padding:0!important;display:none}
.map-screen.active{display:flex;flex-direction:column}
#map{flex:1;margin-bottom:calc(var(--nav-h) + var(--safe-bottom))}

/* dark map filters */
.map-filters{
  display:flex;gap:5px;padding:8px 10px;
  overflow-x:auto;background:rgba(10,20,64,.95);
  border-bottom:1px solid rgba(255,215,0,.2);flex-shrink:0;
  -webkit-overflow-scrolling:touch;
}
.map-filters::-webkit-scrollbar{display:none}
.map-filter-chip{
  white-space:nowrap;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:var(--radius-pill);
  padding:4px 10px;font-size:.63rem;font-weight:700;
  color:rgba(255,255,255,.45);flex-shrink:0;transition:all .15s;
  text-transform:uppercase;letter-spacing:.04em;
}
.map-filter-chip.on{
  background:var(--yellow);color:var(--sky);
  border-color:var(--yellow);
  box-shadow:0 0 10px rgba(255,215,0,.4);
}

/* leaflet overrides for dark theme */
.leaflet-popup-content-wrapper{
  border-radius:var(--radius)!important;padding:0!important;
  overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.3)!important;
  max-width:250px;border:2px solid var(--border);
}
.leaflet-popup-content{margin:0!important;width:100%!important}
.popup-inner{padding:12px 14px;background:var(--card-bg)}
.popup-day{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:700}
.popup-name{font-size:.92rem;font-weight:900;color:#1a1f3a;margin-bottom:5px;line-height:1.3}
.popup-desc{font-size:.66rem;color:#4a5280;line-height:1.45}
.popup-tip{margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-size:.63rem;color:var(--pokered);font-weight:700}
.popup-tip::before{content:'⚡ '}

.leaflet-control-zoom{border:none!important;box-shadow:var(--shadow)!important}
.leaflet-control-zoom a{
  background:var(--sky)!important;color:var(--yellow)!important;
  border-bottom:1px solid rgba(255,215,0,.2)!important;
  font-weight:900!important;width:30px!important;height:30px!important;line-height:30px!important;
}
.leaflet-control-attribution{font-size:.5rem!important;background:rgba(10,20,64,.8)!important;color:rgba(255,255,255,.4)!important}

/* ── INFO BANNERS ── */
.info-banner{border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:.69rem;line-height:1.5}
.info-banner.green{background:var(--caught-bg);border:1.5px solid var(--caught-border);color:#1b5e20}
.info-banner.warn{background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.3);color:#8b0000;border-left:3px solid var(--pokered)}
.info-banner.blue{background:linear-gradient(135deg,var(--sky3),#1a237e);border:1.5px solid rgba(255,215,0,.2);color:#c5caf5}
.info-banner strong{color:var(--yellow)}

/* ── TOAST ── */
.toast{
  position:fixed;
  bottom:calc(var(--nav-h) + var(--safe-bottom) + 12px);
  left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--pokered),#990000);
  color:#fff;font-size:.74rem;font-weight:800;
  padding:8px 18px;border-radius:var(--radius-pill);
  box-shadow:0 4px 20px rgba(204,0,0,.4);
  z-index:9999;white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:90%;border:1.5px solid rgba(255,255,255,.2);
  text-transform:uppercase;letter-spacing:.06em;
}
.toast.show{opacity:1}

/* badges */
.cbadge{display:inline-block;background:var(--caught-bg);color:var(--caught);font-size:.56rem;font-weight:900;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;border:1px solid var(--caught-border)}
.wbadge{display:inline-block;background:rgba(255,215,0,.15);color:#b8860b;font-size:.56rem;font-weight:900;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;border:1px solid var(--yellow)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ═══════════════════════════════════════════
   EDIT MODE STYLES
═══════════════════════════════════════════ */

/* Edit screen header */
.edit-section-title {
  font-size:.65rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:var(--yellow);
  margin:14px 0 8px;padding:0 2px;
  text-shadow:0 0 10px rgba(255,215,0,.4);
  display:flex;align-items:center;justify-content:space-between;
}
.edit-section-title:first-child { margin-top:0; }

/* Edit cards */
.edit-card {
  background:var(--card-bg);border:2px solid var(--border);
  border-radius:var(--radius);margin-bottom:8px;
  overflow:hidden;box-shadow:var(--shadow);
}
.edit-card-header {
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(240,244,255,.95));
  -webkit-tap-highlight-color:transparent;
}
.edit-card-header .day-num { font-size:.58rem; }
.edit-card-body {
  display:none;padding:12px;
  border-top:1.5px solid var(--border);
  background:rgba(255,255,255,.98);
}
.edit-card.open .edit-card-body { display:block; }
.edit-card-chevron {
  font-size:.75rem;color:var(--border);
  margin-left:auto;transition:transform .2s;
}
.edit-card.open .edit-card-chevron { transform:rotate(180deg); }

/* Stop edit rows */
.stop-edit-row {
  background:var(--card-bg2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px;
  margin-bottom:8px;position:relative;
}
.stop-edit-row:last-child { margin-bottom:0; }
.stop-edit-label {
  font-size:.58rem;font-weight:900;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:6px;display:flex;align-items:center;
  justify-content:space-between;
}
.stop-color-dot {
  width:8px;height:8px;border-radius:50%;
  display:inline-block;margin-right:4px;
}

/* Edit inputs */
.edit-input {
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 10px;font-size:.75rem;color:var(--ink);
  background:var(--paper);width:100%;
  transition:border-color .15s;margin-bottom:6px;
}
.edit-input:last-child { margin-bottom:0; }
.edit-input:focus { outline:none;border-color:var(--sky3);box-shadow:0 0 0 3px rgba(30,47,122,.1); }
.edit-input.small { font-size:.7rem; }

/* Edit action buttons */
.edit-btn-row {
  display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;
}
.btn-edit-save {
  background:linear-gradient(135deg,var(--pokered),#990000);
  color:#fff;font-size:.68rem;font-weight:900;
  padding:7px 14px;border-radius:var(--radius-pill);
  letter-spacing:.04em;text-transform:uppercase;
  box-shadow:0 3px 8px rgba(204,0,0,.25);
  border:1.5px solid rgba(255,255,255,.2);
}
.btn-edit-save::before { content:'⚡ '; }
.btn-edit-cancel {
  background:rgba(200,212,248,.4);color:var(--muted);
  font-size:.68rem;font-weight:700;
  padding:7px 12px;border-radius:var(--radius-pill);
  border:1px solid var(--border);
}
.btn-edit-danger {
  background:rgba(204,0,0,.08);color:var(--pokered);
  font-size:.68rem;font-weight:700;
  padding:7px 12px;border-radius:var(--radius-pill);
  border:1.5px solid rgba(204,0,0,.25);
  margin-left:auto;
}
.btn-add-stop {
  width:100%;background:linear-gradient(135deg,var(--sky),var(--sky3));
  color:var(--yellow);font-size:.68rem;font-weight:800;
  padding:8px;border-radius:var(--radius-sm);
  border:1.5px solid rgba(255,215,0,.25);
  text-transform:uppercase;letter-spacing:.04em;
  margin-top:8px;
}
.btn-add-stop::before { content:'+ '; }

/* Day reorder controls */
.move-btn {
  background:rgba(200,212,248,.4);border:1px solid var(--border);
  border-radius:4px;padding:2px 6px;font-size:.7rem;
  color:var(--muted);
}

/* Reset banner */
.reset-banner {
  background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.25);
  border-radius:var(--radius-sm);padding:10px 12px;
  margin-bottom:12px;font-size:.68rem;color:#8b0000;
  line-height:1.5;display:flex;align-items:center;
  justify-content:space-between;gap:10px;
}
.btn-reset-all {
  background:rgba(204,0,0,.15);color:var(--pokered);
  font-size:.65rem;font-weight:900;
  padding:6px 12px;border-radius:var(--radius-pill);
  border:1.5px solid rgba(204,0,0,.3);
  white-space:nowrap;flex-shrink:0;
}

/* Hotel edit cards */
.hotel-edit-card {
  background:var(--card-bg);border:2px solid var(--border);
  border-radius:var(--radius);padding:12px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.hotel-edit-card .hotel-nights-badge { margin-bottom:8px; }

/* Edit mode intro */
.edit-intro {
  background:linear-gradient(135deg,var(--sky3),#1a237e);
  border:1.5px solid rgba(255,215,0,.2);
  border-radius:var(--radius);padding:10px 12px;
  margin-bottom:12px;font-size:.68rem;color:#c5caf5;
  line-height:1.5;
}
.edit-intro strong { color:var(--yellow); }

/* Unsaved indicator */
.unsaved-dot {
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:var(--yellow);
  margin-left:5px;vertical-align:middle;
  box-shadow:0 0 6px rgba(255,215,0,.6);
  animation:pulse 1.5s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:.6; transform:scale(.8); }
}

/* ── FLOATING EDIT BUTTON ── */
.edit-fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pokered), #990000);
  color: white;
  font-size: 1.2rem;
  border: 2.5px solid var(--yellow);
  box-shadow: 0 4px 16px rgba(204,0,0,.5), 0 0 0 3px rgba(255,215,0,.15);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
}
.edit-fab:active {
  transform: scale(.92);
  box-shadow: 0 2px 8px rgba(204,0,0,.4);
}
/* Hide FAB when edit screen is active */
.edit-fab.hidden { display: none; }


/* ── FOOD & STORES SCREEN ── */
.food-city-header{
  font-family:'Noto Serif JP',serif;font-size:1rem;font-weight:700;
  color:var(--yellow);padding:10px 12px;margin:4px 0 8px;
  background:linear-gradient(135deg,rgba(255,215,0,.08),transparent);
  border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;
  text-shadow:0 0 10px rgba(255,215,0,.3);
}
.food-cat-label{
  font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin:12px 0 6px 2px;
}
.food-card{
  background:#fff;border:2px solid var(--border);border-radius:12px;
  margin-bottom:8px;overflow:hidden;box-shadow:0 2px 12px rgba(13,27,75,.1);
}
.food-card-hdr{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(240,244,255,.95));
}
.food-icon{font-size:1.35rem;flex-shrink:0}
.food-info{flex:1;min-width:0}
.food-name{font-size:.8rem;font-weight:800;color:#1a1f3a;line-height:1.2}
.food-meta{font-size:.62rem;color:var(--muted);margin-top:1px;font-weight:600}
.food-price{
  font-size:.65rem;font-weight:800;padding:3px 8px;
  border-radius:20px;flex-shrink:0;white-space:nowrap;
}
.price-cheap{background:#e6f9f0;color:var(--caught);border:1px solid var(--caught-bd)}
.price-mid{background:rgba(255,215,0,.15);color:#8b6914;border:1px solid rgba(255,215,0,.4)}
.price-high{background:rgba(204,0,0,.08);color:var(--red);border:1px solid rgba(204,0,0,.25)}
.food-body{
  display:none;padding:11px 12px;border-top:1.5px solid var(--border);
  background:rgba(255,255,255,.98);
}
.food-card.open .food-body{display:block}
.food-desc{font-size:.7rem;color:#4a5280;line-height:1.5;margin-bottom:8px}
.food-tip{
  font-size:.67rem;color:var(--red);font-weight:600;
  margin-bottom:8px;line-height:1.4;
}
.food-tip::before{content:'⚡ '}
.food-tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.food-tag{
  font-size:.58rem;font-weight:700;padding:2px 8px;
  border-radius:20px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);
}
.food-map-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--ink),var(--ink2));
  color:var(--yellow);font-size:.67rem;font-weight:800;
  padding:7px 14px;border-radius:20px;
  border:1.5px solid rgba(255,215,0,.3);text-decoration:none;
  text-transform:uppercase;letter-spacing:.04em;
}


/* ── APPS SCREEN ── */
.app-category { font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin:12px 0 6px 2px;text-shadow:0 0 8px rgba(255,215,0,.3); }
.app-card { background:#fff;border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 2px 12px rgba(13,27,75,.1); }
.app-emoji { font-size:1.8rem;flex-shrink:0; }
.app-info { flex:1;min-width:0; }
.app-name { font-size:.8rem;font-weight:800;color:#1a1f3a;margin-bottom:1px; }
.app-desc { font-size:.63rem;color:var(--muted);line-height:1.35; }
.app-tag { font-size:.57rem;font-weight:700;padding:1px 7px;border-radius:10px;display:inline-block;margin-top:3px; }
.app-tag.free { background:#e6f9f0;color:var(--caught);border:1px solid var(--caught-bd); }
.app-tag.preinstalled { background:rgba(255,215,0,.15);color:#8b6914;border:1px solid rgba(255,215,0,.4); }
.app-tag.paid { background:rgba(204,0,0,.08);color:var(--red);border:1px solid rgba(204,0,0,.25); }
.app-btn { background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--yellow);font-size:.63rem;font-weight:800;padding:7px 12px;border-radius:20px;border:1.5px solid rgba(255,215,0,.3);text-decoration:none;white-space:nowrap;flex-shrink:0;display:flex;align-items:center; }
.app-btn.installed { background:linear-gradient(135deg,var(--caught),#16834f);color:#fff;border-color:var(--caught-bd); }
.app-priority { border-left:3px solid var(--red); }
.app-priority-badge { font-size:.55rem;font-weight:900;background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:middle; }


/* ════════════════════════════════════
   POKÉMON GO ENHANCED VISUAL THEME
   Kid-friendly, vibrant, tactile
════════════════════════════════════ */

/* Animated gradient background for screens */
.screen {
  background: linear-gradient(160deg, #0d1b4b 0%, #162259 40%, #1a2d6e 100%) !important;
}

/* Day cards — PGo Pokédex style */
.day-card {
  border-radius: 16px !important;
  border-width: 2px !important;
  position: relative;
  overflow: visible !important;
}

/* Glowing caught border */
.day-card.has-tickets {
  box-shadow: 0 0 0 2px var(--caught-bd), 0 4px 20px rgba(31,168,107,.3) !important;
}

/* Day number badge — bigger, rounder, more PGo */
.day-num {
  font-size: .65rem !important;
  border-radius: 8px !important;
  padding: 4px 8px !important;
  font-weight: 900 !important;
  letter-spacing: .05em !important;
  box-shadow: 0 3px 8px rgba(0,0,0,.3) !important;
}

/* Card header gradient */
.day-header {
  background: linear-gradient(135deg, rgba(255,255,255,.96) 0%, rgba(232,238,255,.97) 100%) !important;
  border-radius: 14px 14px 0 0 !important;
  padding: 11px 14px !important;
}

/* Stop dots — glowing */
.stop-dot {
  width: 10px !important;
  height: 10px !important;
  border: 2px solid rgba(255,255,255,.6) !important;
  box-shadow: 0 0 6px currentColor !important;
}

/* Stop tips — PGo lightning bolt style */
.stop-tip::before { content: '⚡ ' !important; }
.stop-tip { 
  background: rgba(204,0,0,.06) !important;
  border-left: 2px solid var(--red) !important;
  padding: 4px 8px !important;
  border-radius: 0 6px 6px 0 !important;
}

/* Ticket chips — more PGo */
.ticket-chip {
  font-size: .62rem !important;
  padding: 3px 10px !important;
  border-radius: 20px !important;
  letter-spacing: .05em !important;
  box-shadow: 0 2px 6px rgba(31,168,107,.2) !important;
}
.ticket-chip::before { content: '✓ ' !important; }

/* Nav bar — PGo bottom bar style */
.bottom-nav {
  border-top: 2px solid rgba(255,215,0,.4) !important;
  background: linear-gradient(180deg, var(--nav-bg-top) 0%, var(--nav-bg-bottom) 100%) !important;
}
.nav-btn.active .nav-label { color: var(--active-type-color) !important; font-weight: 900 !important; }
.nav-icon { font-size: 1.25rem !important; }

/* Pokéball spinner in header */
.pokeball {
  animation: pokeball-spin 8s linear infinite;
}
@keyframes pokeball-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Header — stronger red gradient */
.hdr {
  background: linear-gradient(135deg, #dd0000 0%, #aa0000 50%, #880000 100%) !important;
  box-shadow: 0 3px 20px rgba(204,0,0,.6) !important;
}

/* Edit + book button bar */
.top-action-bar button {
  border-radius: 12px !important;
  font-size: .75rem !important;
  font-weight: 900 !important;
  padding: 10px !important;
  letter-spacing: .04em !important;
}

/* Pokédex catch screen */
.poke-item {
  border-radius: 14px !important;
  border-width: 2px !important;
}
.poke-item.caught {
  box-shadow: 0 0 0 2px var(--caught-bd), 0 4px 16px rgba(31,168,107,.25) !important;
}
.bi-status.ok {
  animation: caught-pulse 2s ease-in-out infinite;
}
@keyframes caught-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(31,168,107,.4); }
  50% { box-shadow: 0 0 0 4px rgba(31,168,107,.1); }
}

/* urgency dots — glowing */
.urgency-high { box-shadow: 0 0 8px rgba(255,26,26,.8) !important; animation: red-pulse 1.5s ease infinite; }
.urgency-med  { box-shadow: 0 0 8px rgba(255,215,0,.6) !important; }
@keyframes red-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .7; transform: scale(1.2); }
}

/* XP bar — more vibrant */
.xp-fill {
  background: linear-gradient(90deg, #00e676, #1fa86b, #00c853) !important;
  box-shadow: 0 0 12px rgba(0,230,118,.5) !important;
}
.xp-bar-wrap {
  height: 12px !important;
  border-radius: 6px !important;
}

/* Food cards */
.food-card { border-radius: 14px !important; }
.food-card-hdr { background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(232,238,255,.97)) !important; }

/* App cards */
.app-card { border-radius: 14px !important; }
.app-card.app-priority { 
  border-left: 4px solid var(--red) !important;
  box-shadow: 0 0 0 1px rgba(204,0,0,.15), 0 4px 16px rgba(204,0,0,.1) !important;
}

/* Catch button */
.btn-catch, .btn-save {
  font-size: .8rem !important;
  padding: 11px !important;
  border-radius: 25px !important;
  letter-spacing: .08em !important;
  box-shadow: 0 4px 16px rgba(204,0,0,.4) !important;
}
.btn-catch::before, .btn-save::before { content: '⚡ ' !important; }

/* Toast — more PGo */
.toast {
  border-radius: 25px !important;
  font-size: .78rem !important;
  padding: 10px 22px !important;
  box-shadow: 0 6px 24px rgba(204,0,0,.5) !important;
}

/* Section labels */
.sec, .xp-lbl, .food-city-header {
  text-shadow: 0 0 15px rgba(255,215,0,.5) !important;
}

/* Banner improvements */
.banner.blue {
  border-radius: 12px !important;
  border: 1.5px solid rgba(255,215,0,.25) !important;
}
.banner.green {
  border-radius: 12px !important;
}

/* Flight cards */
.flight-card, .hotel-card {
  border-radius: 14px !important;
}

/* Map filter chips */
.mchip.on {
  box-shadow: 0 0 12px rgba(255,215,0,.5) !important;
  font-weight: 900 !important;
}

/* Edit cards */
.ecard { border-radius: 12px !important; }
.ecard-hdr { background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(232,238,255,.97)) !important; }

/* Scrollbar styling for screens */
.screen { scrollbar-width: thin; scrollbar-color: rgba(255,215,0,.3) transparent; }


/* ════════════════════════════════════
   CUSTOMS DUTY CALCULATOR
════════════════════════════════════ */
.customs-card {
  background: linear-gradient(135deg, #0b1a3a, #132552);
  border: 2px solid var(--yellow);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 0 20px rgba(255,215,0,.15);
}
.customs-title {
  font-size: 1rem; font-weight: 900;
  color: var(--yellow); text-align: center;
  margin-bottom: 4px;
  text-shadow: 0 0 10px rgba(255,215,0,.4);
}
.customs-sub {
  font-size: .67rem; color: rgba(255,255,255,.5);
  text-align: center; margin-bottom: 16px;
}
.customs-label {
  font-size: .65rem; font-weight: 700;
  color: #cfd6ee; margin-bottom: 5px; display: block;
}
.customs-input {
  width: 100%; padding: 10px 12px;
  border-radius: 8px; border: 1.5px solid var(--yellow);
  background: #0d1f4a; color: #fff;
  font-size: .82rem; margin-bottom: 12px;
  box-sizing: border-box;
}
.customs-input:focus { outline: none; border-color: #fff; }
.customs-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--red), #990000);
  color: #fff; font-size: .8rem; font-weight: 900;
  padding: 12px; border-radius: 25px;
  border: 1.5px solid rgba(255,215,0,.3);
  letter-spacing: .06em; text-transform: uppercase;
  box-shadow: 0 4px 16px rgba(204,0,0,.4);
  margin-bottom: 14px;
}
.customs-result-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 9px 12px;
  border-radius: 8px; margin-bottom: 6px;
  background: rgba(255,255,255,.05);
}
.customs-result-row.exempt { background: rgba(31,168,107,.12); }
.customs-result-row.flat   { background: rgba(255,215,0,.08); }
.customs-result-row.excess { background: rgba(204,0,0,.12); }
.customs-result-label { font-size: .67rem; color: #cfd6ee; }
.customs-result-val   { font-size: .75rem; font-weight: 800; color: #fff; }
.customs-total {
  background: linear-gradient(90deg, var(--yellow), #ffe566);
  color: var(--ink); border-radius: 10px;
  padding: 14px; text-align: center;
  font-weight: 900; font-size: 1rem;
  margin-top: 10px;
  box-shadow: 0 0 16px rgba(255,215,0,.3);
}
.customs-cat-panel {
  display: none;
  background: rgba(13,31,74,.8);
  border: 1px solid rgba(255,215,0,.3);
  border-radius: 10px; padding: 12px;
  margin-bottom: 10px;
}
.customs-cat-title {
  font-size: .7rem; font-weight: 900;
  color: var(--yellow); margin-bottom: 4px;
}
.customs-cat-sub {
  font-size: .6rem; color: rgba(255,255,255,.4);
  margin-bottom: 10px; line-height: 1.4;
}
.customs-cat-row {
  display: flex; align-items: center;
  gap: 6px; margin-bottom: 7px;
}
.customs-cat-label {
  flex: 1; font-size: .63rem; color: #cfd6ee;
}
.customs-cat-input {
  width: 72px; padding: 5px 7px;
  border-radius: 6px; border: 1px solid rgba(255,215,0,.4);
  background: #0d1f4a; color: #fff; font-size: .68rem;
}
.customs-cat-rate {
  width: 52px; padding: 5px 7px;
  border-radius: 6px; border: 1px solid rgba(255,215,0,.4);
  background: #0d1f4a; color: var(--yellow); font-size: .68rem;
}
.customs-cat-pct { font-size: .6rem; color: rgba(255,255,255,.4); }
.customs-toggle-btn {
  width: 100%; padding: 9px;
  border: 1px solid var(--yellow); border-radius: 8px;
  background: transparent; color: var(--yellow);
  font-size: .7rem; font-weight: 700; margin-bottom: 10px;
}
.customs-bracket-info {
  background: rgba(255,255,255,.05);
  border-radius: 10px; padding: 12px;
  margin-bottom: 12px;
}
.customs-bracket-row {
  display: flex; justify-content: space-between;
  font-size: .65rem; padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
  color: #cfd6ee;
}
.customs-bracket-row:last-child { border-bottom: none; }
.customs-bracket-row span:last-child { font-weight: 800; color: var(--yellow); }


/* ── WEATHER SCREEN ── */
#screen-weather { background: linear-gradient(160deg,#0d1b4b 0%,#162259 100%) !important; }






/* ════════════════════════════════════
   ADVENTURE / QUEST SCREEN
════════════════════════════════════ */
.trainer-card {
  background: linear-gradient(135deg, #1a237e, #283593);
  border: 2px solid var(--yellow);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,215,0,.2);
}
.trainer-card::before {
  content: '';
  position: absolute;
  top: -50%;left: -50%;
  width: 200%;height: 200%;
  background: radial-gradient(circle, rgba(255,215,0,.05) 0%, transparent 60%);
  animation: trainer-glow 3s ease-in-out infinite;
}
@keyframes trainer-glow {
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.1);opacity:.7}
}
.trainer-avatar {
  font-size: 3.5rem;
  margin-bottom: 6px;
  display: block;
  filter: drop-shadow(0 0 10px rgba(255,215,0,.4));
}
.trainer-name {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--yellow);
  letter-spacing: .08em;
  text-shadow: 0 0 12px rgba(255,215,0,.5);
}
.trainer-rank {
  font-size: .65rem;
  font-weight: 700;
  color: rgba(255,255,255,.7);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.trainer-xp-wrap {
  background: rgba(0,0,0,.3);
  border-radius: 20px;
  height: 14px;
  overflow: hidden;
  margin: 8px 0 4px;
  border: 1px solid rgba(255,215,0,.2);
}
.trainer-xp-fill {
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, #ffd700, #ffec6e, #ffd700);
  background-size: 200% 100%;
  animation: xp-shimmer 2s linear infinite;
  transition: width .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 0 10px rgba(255,215,0,.6);
}
@keyframes xp-shimmer {
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
.trainer-xp-label {
  font-size: .62rem;
  color: rgba(255,255,255,.6);
  display: flex;
  justify-content: space-between;
}
.trainer-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.trainer-stat {
  background: rgba(0,0,0,.25);
  border-radius: 8px;
  padding: 6px 4px;
  border: 1px solid rgba(255,215,0,.15);
}
.trainer-stat-val {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--yellow);
  display: block;
}
.trainer-stat-lbl {
  font-size: .55rem;
  color: rgba(255,255,255,.5);
  text-transform: uppercase;
  letter-spacing: .07em;
}

/* Quest items */
.quest-section-lbl {
  font-size: .62rem;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--yellow);
  margin: 12px 0 6px;
  text-shadow: 0 0 8px rgba(255,215,0,.4);
}
.quest-item {
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 8px rgba(13,27,75,.08);
}
.quest-item.completed {
  background: var(--caught-bg);
  border-color: var(--caught-bd);
  box-shadow: 0 0 12px rgba(31,168,107,.2);
}
.quest-item.completed .quest-name { text-decoration: line-through; color: var(--muted); }
.quest-check {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2.5px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  transition: all .2s;
}
.quest-item.completed .quest-check {
  background: var(--caught);
  border-color: var(--caught);
  box-shadow: 0 0 8px rgba(31,168,107,.4);
}
.quest-icon { font-size: 1.3rem; flex-shrink: 0; }
.quest-info { flex: 1; min-width: 0; }
.quest-name { font-size: .78rem; font-weight: 700; color: #1a1f3a; }
.quest-day  { font-size: .62rem; color: var(--muted); margin-top: 1px; }
.quest-xp   {
  font-size: .58rem; font-weight: 900;
  background: rgba(255,215,0,.15);
  color: #8b6914;
  border: 1px solid rgba(255,215,0,.4);
  border-radius: 10px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.quest-item.completed .quest-xp {
  background: var(--caught-bg);
  color: var(--caught);
  border-color: var(--caught-bd);
}

/* Level up toast */
.levelup-toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  background: linear-gradient(135deg, #1a237e, #283593);
  border: 3px solid var(--yellow);
  border-radius: 20px;
  padding: 24px 32px;
  text-align: center;
  z-index: 9999;
  box-shadow: 0 0 40px rgba(255,215,0,.4);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.levelup-toast.show { transform: translate(-50%,-50%) scale(1); }
.levelup-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
.levelup-title { font-size: 1.1rem; font-weight: 900; color: var(--yellow); }
.levelup-sub   { font-size: .75rem; color: rgba(255,255,255,.7); margin-top: 4px; }

/* ════════════════════════════════════
   PHOTOS SCREEN
════════════════════════════════════ */
.photos-day-header {
  font-size: .72rem;
  font-weight: 900;
  color: var(--yellow);
  margin: 12px 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 4px;
}
.photo-thumb {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  background: var(--card);
  border: 1.5px solid var(--border);
}
.photo-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.photo-thumb .photo-del {
  position: absolute;
  top: 3px; right: 3px;
  background: rgba(204,0,0,.85);
  color: #fff;
  border-radius: 50%;
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem;
  cursor: pointer;
}
.photo-add-btn {
  aspect-ratio: 1;
  border-radius: 8px;

/* ════════════════════════════════════

════════════════════════════════════ */
.translate-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 10px;

}
.translate-tabs::-webkit-scrollbar { display: none; }
.ttab {

  font-weight: 700;

.phrase-card {

}
.phrase-card:active { background: var(--card); }
.phrase-en {
  font-size: .78rem;
  font-weight: 700;
  color: #1a1f3a;
  margin-bottom: 4px;
}
.phrase-jp {
  font-size: 1rem;
  font-weight: 700;
  color: var(--red);
  margin-bottom: 3px;
  font-family: 'Noto Serif JP', serif;
}
.phrase-rom {
  font-size: .68rem;
  color: var(--muted);
  font-style: italic;
}
.phrase-copy {
  float: right;
  background: var(--ink);
  color: var(--yellow);
  font-size: .58rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 10px;

  border: 1px solid rgba(255,215,0,.3);

.phrase-card.copied .phrase-copy {
  background: var(--caught);
  color: #fff;
  border-color: var(--caught-bd);
}
.translate-search {
  width: 100%;
  background: rgba(255,255,255,.1);
  border: 1.5px solid rgba(255,215,0,.25);
  border-radius: 25px;
  padding: 9px 16px;
  font-size: .78rem;
  color: #fff;
  margin-bottom: 12px;
}
.translate-search::placeholder { color: rgba(255,255,255,.35); }
.translate-search:focus { outline: none; border-color: var(--yellow); }
.kid-section {
  background: linear-gradient(135deg, rgba(255,215,0,.1), rgba(255,215,0,.05));
  border: 1.5px solid rgba(255,215,0,.3);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
}
.kid-section-title {
  font-size: .68rem;
  font-weight: 900;
  color: var(--yellow);
  margin-bottom: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.kid-word {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  background: rgba(255,255,255,.95);
  border-radius: 10px;
  padding: 8px 10px;
  margin: 4px;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);

}
.kid-word:active { transform: scale(.95); }
.kid-emoji { font-size: 1.6rem; }
.kid-jp { font-size: .78rem; font-weight: 700; color: var(--red); font-family: 'Noto Serif JP', serif; }
.kid-en { font-size: .58rem; color: var(--muted); margin-top: 1px; }

.customs-card {

}
.customs-cat-title {
  font-size: .7rem; font-weight: 900;
  color: var(--yellow); margin-bottom: 4px;
}
.customs-cat-sub {
  font-size: .6rem; color: rgba(255,255,255,.4);

}
.customs-cat-row {
  display: flex; align-items: center;

}

  flex: 1; font-size: .63rem; color: #cfd6ee;
}
.customs-cat-input {
  width: 72px; padding: 5px 7px;

}

  width: 52px; padding: 5px 7px;
  border-radius: 6px; border: 1px solid rgba(255,215,0,.4);

}

.customs-toggle-btn {
  width: 100%; padding: 9px;

  background: rgba(255,255,255,.05);
  border-radius: 10px; padding: 12px;
  margin-bottom: 12px;
}
.customs-bracket-row {
  display: flex; justify-content: space-between;
  font-size: .65rem; padding: 4px 0;

.customs-bracket-row span:last-child { font-weight: 800; color: var(--yellow); }

<script>
/* ═══════════════════════════════════════════
   JAPAN 2026 — APP LOGIC
═══════════════════════════════════════════ */

/* ── SERVICE WORKER ──────────────────────── */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/* ── STATE ───────────────────────────────── */
const STATE = {
  activeScreen: 'itin',
  tickets: {},        // { [key]: {confirmation, date, time, notes, adults, children, status} }
  mapFilters: new Set(Object.keys(CITIES)),
  mapMarkers: [],
  map: null,
  expandedDays: new Set(),
  expandedItems: new Set(),
  deferredInstall: null,
};

/* ── STORAGE ─────────────────────────────── */
function saveTickets(){
  try{ localStorage.setItem('japan2026_tickets', JSON.stringify(STATE.tickets)); }catch(e){}
}


/* ── TOAST ───────────────────────────────── */
function showToast(msg, duration=2000){
  let t=document.querySelector('.toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

/* ── NAV ─────────────────────────────────── */
function navigate(screen){
  STATE.activeScreen=screen;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const screenEl=document.getElementById('screen-'+screen);
  if(screenEl) screenEl.classList.add('active');
  const navEl=document.getElementById('nav-'+screen);
  if(navEl) navEl.classList.add('active');
  if(screen==='map') initMap();
  if(screen==='edit') renderEdit();
  if(screen==='food') renderFood();
  if(screen==='apps') renderApps();
  if(screen==='customs') renderCustoms();
  if(screen==='weather') renderWeather();
  if(screen==='alerts') renderAlerts();
  if(screen==='links') renderLinks();
  updateAlertBadge();
}

/* ── ITINERARY SCREEN ────────────────────── */


function toggleDay(dayNum, card){
  if(STATE.expandedDays.has(dayNum)){
    STATE.expandedDays.delete(dayNum);
    card.classList.remove('expanded');
  } else {
    STATE.expandedDays.add(dayNum);
    card.classList.add('expanded');
  }
}



/* ── FLIGHTS SCREEN ──────────────────────── */


/* ── TICKETS SCREEN ──────────────────────── */












/* ── LINKS SCREEN ────────────────────────── */


/* ── ALERTS SCREEN ───────────────────────── */




/* ── MAP SCREEN ──────────────────────────── */
function initMap(){
  if(STATE.map) return;
  STATE.map=L.map('map',{zoomControl:true}).setView([35.6,137.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">Carto</a>',
    subdomains:'abcd', maxZoom:19,
  }).addTo(STATE.map);
  buildMapMarkers();
  buildMapFilters();
}

function makeMarkerIcon(dayNum, color){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">
    <path d="M15 0C6.7 0 0 6.7 0 15c0 9.4 15 23 15 23S30 24.4 30 15C30 6.7 23.3 0 15 0z" fill="${color}" stroke="white" stroke-width="1.8"/>
    <circle cx="15" cy="15" r="7" fill="white"/>
    <text x="15" y="${dayNum>9?'19.5':'19'}" text-anchor="middle" font-size="${dayNum>9?'7':'9'}" font-weight="bold" fill="${color}" font-family="Inter,sans-serif">${dayNum}</text>
  </svg>`;
  return L.icon({
    iconUrl:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),
    iconSize:[26,33], iconAnchor:[13,33], popupAnchor:[0,-33],
  });
}

function buildMapMarkers(){
  STATE.mapMarkers.forEach(m=>STATE.map.removeLayer(m));
  STATE.mapMarkers=[];
  DAYS.forEach(day=>{
    if(!STATE.mapFilters.has(day.city)) return;
    const color=CITIES[day.city].color;
    day.stops.forEach(stop=>{
      if(!stop.lat) return;
      const marker=L.marker([stop.lat,stop.lng],{icon:makeMarkerIcon(day.day,color)});
      const tipHtml=stop.tip?`<div class="popup-tip">💡 ${stop.tip}</div>`:'';
      marker.bindPopup(`<div class="popup-inner">
        <div class="popup-day">Day ${day.day} · ${day.date} · ${CITIES[day.city].label}</div>
        <div class="popup-name">${stop.name}</div>
        <div class="popup-desc">${stop.note}</div>
        ${tipHtml}
      </div>`,{maxWidth:240});
      marker.addTo(STATE.map);
      STATE.mapMarkers.push(marker);
    });
  });
}

function buildMapFilters(){
  const bar=document.getElementById('map-filter-bar'); bar.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='map-filter-chip on'; allBtn.textContent='All'; allBtn.dataset.city='all';
  allBtn.onclick=()=>toggleMapFilter('all',allBtn); bar.appendChild(allBtn);
  Object.entries(CITIES).forEach(([k,v])=>{
    const btn=document.createElement('button');
    btn.className='map-filter-chip on'; btn.textContent=v.label; btn.dataset.city=k;
    btn.onclick=()=>toggleMapFilter(k,btn); bar.appendChild(btn);
  });
}

function toggleMapFilter(city,btn){
  if(city==='all'){
    STATE.mapFilters=new Set(Object.keys(CITIES));
    document.querySelectorAll('.map-filter-chip').forEach(b=>b.classList.add('on'));
  } else {
    if(STATE.mapFilters.has(city)){ STATE.mapFilters.delete(city); btn.classList.remove('on'); }
    else{ STATE.mapFilters.add(city); btn.classList.add('on'); }
    document.querySelector('[data-city="all"]').classList.toggle('on', STATE.mapFilters.size===Object.keys(CITIES).length);
  }
  buildMapMarkers();
}

/* ── PWA INSTALL ─────────────────────────── */
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  STATE.deferredInstall=e;
  document.getElementById('install-btn').classList.add('visible');
});
function promptInstall(){
  if(STATE.deferredInstall){
    STATE.deferredInstall.prompt();
    STATE.deferredInstall.userChoice.then(()=>{ document.getElementById('install-btn').classList.remove('visible'); });
  }
}

/* ── INIT ────────────────────────────────── */
document.addEventListener('DOMContentLoaded',()=>{
  STATE.edits={};
  STATE.hotelEdits={};
  loadTickets();
  loadEdits();
  renderItin();
  renderFlights();
  renderHotels();
  renderLinks();
  renderAlerts();
  updateAlertBadge();
  navigate('itin');
});

═══════════════════════════════════════════ */

// ── Storage keys ──────────────────────────
const EDIT_KEY  = 'japan2026_edits';   // day/stop edits
const HOTEL_KEY = 'japan2026_hotels';  // hotel edits

// ── Load edits ────────────────────────────
function loadEdits(){
  try {
    const raw=localStorage.getItem(EDIT_KEY);
    if(raw) STATE.edits=JSON.parse(raw);
    else STATE.edits={};
  } catch(e){ STATE.edits={}; }

  try {
    const raw=localStorage.getItem(HOTEL_KEY);
    if(raw) STATE.hotelEdits=JSON.parse(raw);
    else STATE.hotelEdits={};
  } catch(e){ STATE.hotelEdits={}; }
}

function saveEdits(){
  try { localStorage.setItem(EDIT_KEY, JSON.stringify(STATE.edits)); } catch(e){}
}
function saveHotelEdits(){
  try { localStorage.setItem(HOTEL_KEY, JSON.stringify(STATE.hotelEdits)); } catch(e){}
}

// ── Get effective day data (edits override defaults) ──
function getEffectiveDay(day){
  const edit=STATE.edits['day_'+day.day]||{};
  const stops=(edit.stops||day.stops).map((s,i)=>{
    const se=(STATE.edits['stop_'+day.day+'_'+i])||{};
    return {...s,...se};
  });
  // also handle added stops
  const added=STATE.edits['added_'+day.day]||[];
  return {
    ...day,
    date: edit.date||day.date,
    label: edit.label||day.label,
    stops: [...stops,...added],
  };
}

function getEffectiveHotel(h,idx){
  const edit=STATE.hotelEdits['hotel_'+idx]||{};
  return {...h,...edit};
}

// ── EDIT SCREEN ───────────────────────────
function renderEdit(){
  const wrap=document.getElementById('screen-edit');
  wrap.innerHTML='';

  // Header
  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;';
  hdr.innerHTML=`
    <button onclick="navigate('itin')" style="background:rgba(255,215,0,.15);border:1.5px solid rgba(255,215,0,.4);border-radius:20px;padding:7px 14px;font-size:.72rem;font-weight:800;color:var(--yellow);">← BACK</button>
    <span style="font-size:.65rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);text-shadow:0 0 8px rgba(255,215,0,.4)">✏️ EDIT MODE</span>

  const hotelSec=document.createElement('div');
  hotelSec.innerHTML=`<div class="sec" style="margin-bottom:8px">🏨 HOTELS</div>`;
  wrap.appendChild(hotelSec);

  HOTELS.forEach((h,idx)=>{
    const eff=getEffectiveHotel?getEffectiveHotel(h,idx):h;

    hcard.style.cssText='background:#fff;border:2px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;';
    hcard.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">

        <button onclick="toggleHotelEdit(${idx},this)" style="background:linear-gradient(135deg,var(--red),#990000);color:#fff;font-size:.62rem;font-weight:800;padding:4px 12px;border-radius:10px;border:none;">✏️ Edit</button>

      <div id="hotel-display-${idx}">
        <div style="font-size:.8rem;font-weight:800;color:#1a1f3a;">${eff.name}</div>
