      </div>
      <div id="hotel-form-${idx}" style="display:none;margin-top:8px;">
        <input class="f-in" id="hf-name-${idx}" placeholder="Hotel name" value="${eff.name}" style="margin-bottom:6px;">
        <input class="f-in" id="hf-sub-${idx}" placeholder="Location" value="${eff.sub}" style="margin-bottom:6px;">
        <input class="f-in" id="hf-nights-${idx}" placeholder="Dates & nights" value="${eff.nights}" style="margin-bottom:8px;">
        <div style="display:flex;gap:6px;">
          <button onclick="saveHotelEdit(${idx})" style="flex:1;background:linear-gradient(135deg,var(--red),#990000);color:#fff;font-size:.72rem;font-weight:900;padding:8px;border-radius:20px;border:none;">⚡ SAVE</button>
          <button onclick="toggleHotelEdit(${idx},null,true)" style="background:rgba(200,212,248,.4);color:var(--muted);font-size:.72rem;font-weight:700;padding:8px 14px;border-radius:20px;border:1px solid var(--border);">Cancel</button>
        </div>
      </div>
    `;
    wrap.appendChild(hcard);
  });

  // Days section
  const daySec=document.createElement('div');
  daySec.innerHTML=`<div class="sec" style="margin:14px 0 8px">📅 DAYS & STOPS</div>`;
  wrap.appendChild(daySec);

  DAYS.forEach(rawDay=>{
    const eff=STATE.edits?getEffectiveDay(rawDay):rawDay;
    const color=CITIES[rawDay.city].color;
    const hasEdits=STATE.edits&&(STATE.edits['day_'+rawDay.day]||STATE.edits['added_'+rawDay.day]);

    const dc=document.createElement('div');
    dc.style.cssText='background:#fff;border:2px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;';
    if(hasEdits) dc.style.borderColor='rgba(255,215,0,.6)';

    // Day header - always visible
    const dhdr=document.createElement('div');
    dhdr.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(232,238,255,.97));';
    dhdr.innerHTML=`
      <span style="font-size:.6rem;font-weight:900;background:${color};color:#fff;border-radius:6px;padding:3px 8px;">${rawDay.day}</span>
      <div style="flex:1;">
        <div style="font-size:.76rem;font-weight:700;color:#1a1f3a;">${eff.date}</div>
        <div style="font-size:.64rem;color:var(--muted);">${eff.label}${hasEdits?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-left:5px;vertical-align:middle;"></span>':''}</div>
      </div>
      <span style="font-size:.7rem;color:var(--border);transition:transform .2s;" class="edit-chev-${rawDay.day}">▾</span>
    `;
    dhdr.onclick=()=>toggleEditDay(rawDay.day, dc);
    dc.appendChild(dhdr);

    // Day body - collapsible
    const dbody=document.createElement('div');
    dbody.id=`edit-day-body-${rawDay.day}`;
    dbody.style.cssText='display:none;padding:10px 12px;border-top:1.5px solid var(--border);';

    // Date + label edit fields
    dbody.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
        <div>
          <div class="f-lbl">Date</div>
          <input class="f-in" id="ed-date-${rawDay.day}" value="${eff.date}" placeholder="e.g. Oct 31">
        </div>
        <div>
          <div class="f-lbl">Label</div>
          <input class="f-in" id="ed-label-${rawDay.day}" value="${eff.label}" placeholder="Day title">
        </div>
      </div>
      <button onclick="saveDayHeader(${rawDay.day})" style="width:100%;background:linear-gradient(135deg,var(--red),#990000);color:#fff;font-size:.7rem;font-weight:900;padding:7px;border-radius:20px;border:none;margin-bottom:10px;">⚡ SAVE HEADER</button>
      <div style="font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">STOPS</div>
    `;

    // Stops
    const visStops=eff.stops.filter(s=>s.name!=='[Removed]');
    visStops.forEach((stop, si)=>{
      const isAdded=si>=rawDay.stops.length;
      const srow=document.createElement('div');
      srow.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:7px;';
      srow.id=`stop-edit-row-${rawDay.day}-${si}`;
      srow.innerHTML=`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
          <span style="font-size:.58rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:4px;"></span>
            Stop ${si+1}${isAdded?' (Added)':''}
          </span>
          <div style="display:flex;gap:4px;">
            ${si>0?`<button onclick="moveStopUp(${rawDay.day},${si})" style="background:rgba(200,212,248,.5);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:.7rem;color:var(--muted);">↑</button>`:''}
            ${si<visStops.length-1?`<button onclick="moveStopDown(${rawDay.day},${si})" style="background:rgba(200,212,248,.5);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:.7rem;color:var(--muted);">↓</button>`:''}
            <button onclick="removeStop(${rawDay.day},${si},${isAdded})" style="background:rgba(204,0,0,.08);border:1.5px solid rgba(204,0,0,.25);border-radius:5px;padding:2px 8px;font-size:.62rem;font-weight:700;color:var(--red);">✕</button>
          </div>
        </div>
        <input class="f-in" id="sn-${rawDay.day}-${si}" placeholder="Stop name" value="${(stop.name||'').replace(/"/g,'&quot;')}" style="margin-bottom:5px;">
        <input class="f-in" id="snt-${rawDay.day}-${si}" placeholder="Note / description" value="${(stop.note||'').replace(/"/g,'&quot;')}" style="margin-bottom:5px;">
        <input class="f-in" id="stp-${rawDay.day}-${si}" placeholder="⚡ Tip (optional)" value="${(stop.tip||'').replace(/"/g,'&quot;')}" style="margin-bottom:6px;">
        <div style="display:flex;gap:6px;align-items:center;">
          <button onclick="saveStop(${rawDay.day},${si},${isAdded})" style="flex:1;background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--yellow);font-size:.67rem;font-weight:800;padding:6px;border-radius:20px;border:1.5px solid rgba(255,215,0,.3);">Save Stop</button>
          <select onchange="moveStopToDay(${rawDay.day},${si},this.value,${isAdded})" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:.65rem;color:var(--ink);max-width:120px;">
            <option value="">Move to day...</option>
            ${DAYS.filter(d=>d.day!==rawDay.day).map(d=>`<option value="${d.day}">Day ${d.day} — ${d.date}</option>`).join('')}
          </select>
        </div>
      `;
      dbody.appendChild(srow);
    });

    // Add stop button
    const addBtn=document.createElement('button');
    addBtn.style.cssText='width:100%;background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--yellow);font-size:.68rem;font-weight:800;padding:8px;border-radius:8px;border:1.5px solid rgba(255,215,0,.25);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;';
    addBtn.textContent='+ Add New Stop';
    addBtn.onclick=()=>addNewStop(rawDay.day, color);
    dbody.appendChild(addBtn);

    dc.appendChild(dbody);
    wrap.appendChild(dc);
  });
}

function toggleEditDay(dayNum, card){
  const body=document.getElementById(`edit-day-body-${dayNum}`);
  const chev=card.querySelector(`.edit-chev-${dayNum}`);
  if(body.style.display==='none'){
    body.style.display='block';
    if(chev) chev.style.transform='rotate(180deg)';
  } else {
    body.style.display='none';
    if(chev) chev.style.transform='';
  }
}

function toggleHotelEdit(idx, btn, cancel){
  const form=document.getElementById(`hotel-form-${idx}`);
  const display=document.getElementById(`hotel-display-${idx}`);
  if(cancel||form.style.display==='block'){
    form.style.display='none';
    display.style.display='block';
  } else {
    form.style.display='block';
    display.style.display='none';
  }
}

function moveStopUp(dayNum, stopIdx){
  if(stopIdx===0) return;
  swapStops(dayNum, stopIdx, stopIdx-1);
}

function moveStopDown(dayNum, stopIdx){
  const day=DAYS.find(d=>d.day===dayNum);
  const eff=getEffectiveDay(day);
  if(stopIdx>=eff.stops.length-1) return;
  swapStops(dayNum, stopIdx, stopIdx+1);
}

function swapStops(dayNum, i, j){
  const day=DAYS.find(d=>d.day===dayNum);
  const eff=getEffectiveDay(day);
  const stops=[...eff.stops];
  // Swap
  [stops[i],stops[j]]=[stops[j],stops[i]];
  // Save all stop edits in new order
  const baseLen=day.stops.length;
  stops.forEach((stop,idx)=>{
    if(idx<baseLen){
      STATE.edits['stop_'+dayNum+'_'+idx]={name:stop.name,note:stop.note||'',tip:stop.tip||''};
    }
  });
  // Handle added stops
  const added=stops.slice(baseLen).map(s=>({name:s.name,note:s.note||'',tip:s.tip||''}));
  if(added.length) STATE.edits['added_'+dayNum]=added;
  saveEdits();
  renderEdit();
  renderItin();
}

function moveStopToDay(fromDay, stopIdx, toDay, isAdded){
  if(!toDay) return;
  const day=DAYS.find(d=>d.day===fromDay);
  const eff=getEffectiveDay(day);
  const stop={...eff.stops[stopIdx]};
  // Remove from source
  removeStop(fromDay, stopIdx, isAdded, true);
  // Add to destination
  const added=STATE.edits['added_'+toDay]||[];
  added.push({name:stop.name,note:stop.note||'',tip:stop.tip||''});
  STATE.edits['added_'+toDay]=added;
  saveEdits();
  showToast(`✓ Stop moved to Day ${toDay}!`);
  renderEdit();
  renderItin();
}

function removeStop(dayNum, stopIdx, isAdded, silent){
  if(!silent && !confirm('Remove this stop?')) return;
  if(isAdded){
    const day=DAYS.find(d=>d.day===dayNum);
    const realIdx=stopIdx-day.stops.length;
    const added=STATE.edits['added_'+dayNum]||[];
    added.splice(realIdx,1);
    STATE.edits['added_'+dayNum]=added;
  } else {
    STATE.edits['stop_'+dayNum+'_'+stopIdx]={name:'[Removed]',note:'',tip:'',deleted:true};
  }
  saveEdits();
  if(!silent){
    showToast('Stop removed');
    renderEdit();
    renderItin();
  }
}

function resetAllEdits(){
  if(!confirm('Reset ALL edits to defaults? This cannot be undone.')) return;
  STATE.edits={};STATE.hotelEdits={};
  saveEdits();saveHotelEdits();
  showToast('🔄 Reset to defaults');
  renderEdit();renderItin();renderHotels();
}

function buildStopEditRow(dayNum, stopIdx, stop, color, isAdded){
  const row=document.createElement('div');
  row.className='stop-edit-row';
  row.id=`stop-edit-${dayNum}-${stopIdx}`;
  row.innerHTML=`
    <div class="stop-edit-label">
      <span><span class="stop-color-dot" style="background:${color}"></span>Stop ${stopIdx+1}${isAdded?' (Added)':''}</span>
      <button class="btn-edit-danger" style="padding:2px 8px;font-size:.58rem" onclick="deleteStop(${dayNum},${stopIdx},${isAdded})">✕ Remove</button>
    </div>
    <input class="edit-input" id="se-name-${dayNum}-${stopIdx}" placeholder="Stop name" value="${(stop.name||'').replace(/"/g,'&quot;')}">
    <input class="edit-input small" id="se-note-${dayNum}-${stopIdx}" placeholder="Note / description" value="${(stop.note||'').replace(/"/g,'&quot;')}">
    <input class="edit-input small" id="se-tip-${dayNum}-${stopIdx}" placeholder="Tip (optional)" value="${(stop.tip||'').replace(/"/g,'&quot;')}">
    <div class="edit-btn-row">
      <button class="btn-edit-save" onclick="saveStop(${dayNum},${stopIdx},${isAdded})">Save Stop</button>
    </div>
  `;
  return row;
}

function saveDayHeader(dayNum){
  const date=document.getElementById('edit-date-'+dayNum)?.value.trim();
  const label=document.getElementById('edit-label-'+dayNum)?.value.trim();
  if(!STATE.edits['day_'+dayNum]) STATE.edits['day_'+dayNum]={};
  if(date) STATE.edits['day_'+dayNum].date=date;
  if(label) STATE.edits['day_'+dayNum].label=label;
  saveEdits();
  showToast('✓ Day header saved!');
  renderItin();
  // refresh card header
  const day=DAYS.find(d=>d.day===dayNum);
  if(day) renderEdit();
}

function saveStop(dayNum, stopIdx, isAdded){
  const name=document.getElementById(`se-name-${dayNum}-${stopIdx}`)?.value.trim();
  const note=document.getElementById(`se-note-${dayNum}-${stopIdx}`)?.value.trim();
  const tip=document.getElementById(`se-tip-${dayNum}-${stopIdx}`)?.value.trim();

  if(isAdded){
    const added=STATE.edits['added_'+dayNum]||[];
    const realIdx=stopIdx - (DAYS.find(d=>d.day===dayNum)?.stops.length||0);
    if(!added[realIdx]) added[realIdx]={};
    if(name) added[realIdx].name=name;
    if(note!==undefined) added[realIdx].note=note;
    if(tip!==undefined) added[realIdx].tip=tip;
    STATE.edits['added_'+dayNum]=added;
  } else {
    const key='stop_'+dayNum+'_'+stopIdx;
    if(!STATE.edits[key]) STATE.edits[key]={};
    if(name) STATE.edits[key].name=name;
    if(note!==undefined) STATE.edits[key].note=note;
    if(tip!==undefined) STATE.edits[key].tip=tip;
  }
  saveEdits();
  showToast('✓ Stop saved!');
  renderItin();
}

function deleteStop(dayNum, stopIdx, isAdded){
  if(!confirm('Remove this stop?')) return;
  if(isAdded){
    const day=DAYS.find(d=>d.day===dayNum);
    const realIdx=stopIdx-(day?.stops.length||0);
    const added=STATE.edits['added_'+dayNum]||[];
    added.splice(realIdx,1);
    STATE.edits['added_'+dayNum]=added;
  } else {
    // Mark as deleted
    const key='stop_'+dayNum+'_'+stopIdx;
    if(!STATE.edits[key]) STATE.edits[key]={};
    STATE.edits[key].deleted=true;
    STATE.edits[key].name='[Removed]';
    STATE.edits[key].note='';
    STATE.edits[key].tip='';
  }
  saveEdits();
  showToast('Stop removed');
  renderEdit();
  renderItin();
}

function addNewStop(dayNum, color){
  const added=STATE.edits['added_'+dayNum]||[];
  added.push({name:'New Stop',note:'',tip:''});
  STATE.edits['added_'+dayNum]=added;
  saveEdits();
  renderEdit();
  // open that card
  const card=document.getElementById('edit-card-'+dayNum);
  if(card) card.classList.add('open');
  showToast('New stop added — fill in the details');
}

// ── Hotel edit modal ──────────────────────
function openHotelEdit(idx){
  const h=getEffectiveHotel(HOTELS[idx],idx);

  // Build inline form below the hotel card
  const existing=document.getElementById('hotel-edit-form-'+idx);
  if(existing){ existing.remove(); return; } // toggle

  const form=document.createElement('div');
  form.id='hotel-edit-form-'+idx;
  form.style.cssText='background:rgba(255,255,255,.98);border:2px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:-4px;margin-bottom:8px;box-shadow:var(--shadow)';
  form.innerHTML=`
    <div class="stop-edit-label" style="margin-bottom:8px">Edit Hotel ${idx+1}</div>
    <input class="edit-input" id="he-name-${idx}" placeholder="Hotel name" value="${h.name}">
    <input class="edit-input small" id="he-sub-${idx}" placeholder="Location / subtitle" value="${h.sub}">
    <input class="edit-input small" id="he-nights-${idx}" placeholder="Nights (e.g. Oct 22–28 · 6 nights)" value="${h.nights}">
    <input class="edit-input small" id="he-note-${idx}" placeholder="Notes" value="${h.note}">
    <div class="edit-btn-row">
      <button class="btn-edit-save" onclick="saveHotelEdit(${idx})">Save Hotel</button>
      <button class="btn-edit-cancel" onclick="document.getElementById('hotel-edit-form-${idx}').remove()">Cancel</button>
    </div>
  `;

  // Insert after the hotel card
  const hotelCards=document.querySelectorAll('.hotel-edit-card');
  if(hotelCards[idx]) hotelCards[idx].after(form);
}

function saveHotelEdit(idx){
  const name=document.getElementById('he-name-'+idx)?.value.trim();
  const sub=document.getElementById('he-sub-'+idx)?.value.trim();
  const nights=document.getElementById('he-nights-'+idx)?.value.trim();
  const note=document.getElementById('he-note-'+idx)?.value.trim();
  if(!STATE.hotelEdits['hotel_'+idx]) STATE.hotelEdits['hotel_'+idx]={};
  const edit=STATE.hotelEdits['hotel_'+idx];
  if(name) edit.name=name;
  if(sub) edit.sub=sub;
  if(nights) edit.nights=nights;
  if(note) edit.note=note;
  saveHotelEdits();
  showToast('🏨 Hotel updated!');
  document.getElementById('hotel-edit-form-'+idx)?.remove();
  renderEdit();
  renderHotels();
}

</script>

/* ── RENDER FOOD SCREEN ── */
function renderFood() {
  const wrap = document.getElementById('screen-food');
  wrap.innerHTML = '';

  // Intro banner
  const intro = document.createElement('div');
  intro.className = 'banner blue';
  intro.innerHTML = '<strong>🍜 Food & Stores Guide</strong><br>Tap any card for details, tips, and a map link. Organized by city — Tokyo, Osaka, and Kyoto.';
  wrap.appendChild(intro);

  Object.values(FOOD_DATA).forEach(city => {
    // City header
    const cityHdr = document.createElement('div');
    cityHdr.className = 'food-city-header';
    cityHdr.textContent = city.label;
    wrap.appendChild(cityHdr);

    city.categories.forEach(cat => {
      // Category label
      const catLbl = document.createElement('div');
      catLbl.className = 'food-cat-label';
      catLbl.textContent = cat.cat;
      wrap.appendChild(catLbl);

      cat.items.forEach((item, idx) => {
        const id = `food-${city.label}-${cat.cat}-${idx}`.replace(/[^a-z0-9]/gi,'_');
        const card = document.createElement('div');
        card.className = 'food-card';
        card.id = id;

        const hdr = document.createElement('div');
        hdr.className = 'food-card-hdr';
        hdr.innerHTML = `
          <span class="food-icon">${item.icon}</span>
          <div class="food-info">
            <div class="food-name">${item.name}</div>
            <div class="food-meta">📍 ${item.area}</div>
          </div>
          <span class="food-price ${item.priceClass}">${item.price}</span>
        `;
        hdr.onclick = () => {
          card.classList.toggle('open');
        };
        card.appendChild(hdr);

        const body = document.createElement('div');
        body.className = 'food-body';
        const tags = item.tags.map(t => `<span class="food-tag">${t}</span>`).join('');
        body.innerHTML = `
          <div class="food-tag-row">${tags}</div>
          <div class="food-desc">${item.desc}</div>
          <div class="food-tip">${item.tip}</div>
          <a class="food-map-btn" href="${item.maps}" target="_blank" rel="noopener">📍 Open in Maps</a>
        `;
        card.appendChild(body);
        wrap.appendChild(card);
      });
    });
  });
}

<script>
/* ════════════════════════════════════
   WEATHER MODULE — Live forecasts via Open-Meteo (free, no API key)
   Auto-selects city based on current trip day
════════════════════════════════════ */

const WEATHER_CITIES = {
  tokyo:  { name:'Tokyo',   lat:35.6762, lon:139.6503, emoji:'🗼' },
  hakone: { name:'Hakone',  lat:35.2329, lon:139.1065, emoji:'🗻' },
  osaka:  { name:'Osaka',   lat:34.6937, lon:135.5023, emoji:'🏯' },
  kyoto:  { name:'Kyoto',   lat:35.0116, lon:135.7681, emoji:'⛩️' },
  nara:   { name:'Nara',    lat:34.6851, lon:135.8048, emoji:'🦌' },
  kobe:   { name:'Kobe',    lat:34.6901, lon:135.1956, emoji:'🌉' },
  awaji:  { name:'Awaji',   lat:34.5752, lon:135.0008, emoji:'🦖' },
};

const WMO_CODES = {
  0:'☀️ Clear',1:'🌤️ Mostly clear',2:'⛅ Partly cloudy',3:'☁️ Overcast',
  45:'🌫️ Foggy',48:'🌫️ Icy fog',
  51:'🌦️ Light drizzle',53:'🌦️ Drizzle',55:'🌧️ Heavy drizzle',
  61:'🌧️ Light rain',63:'🌧️ Rain',65:'🌧️ Heavy rain',
  71:'🌨️ Light snow',73:'🌨️ Snow',75:'❄️ Heavy snow',
  80:'🌦️ Light showers',81:'🌧️ Showers',82:'⛈️ Heavy showers',
  95:'⛈️ Thunderstorm',96:'⛈️ Thunderstorm + hail',
};

function getTripCity(){
  // Figure out which city we're in based on today's date
  const today = new Date();
  const tripStart = new Date('2026-10-22');
  const diffDays = Math.floor((today - tripStart) / 86400000);
  const dayNum = Math.max(1, Math.min(14, diffDays + 1));

  // Map day to city
  const cityMap = {
    1:'tokyo', 2:'tokyo', 3:'tokyo', 4:'tokyo', 5:'tokyo',
    6:'tokyo', 7:'hakone', 8:'osaka', 9:'osaka', 10:'osaka',
    11:'kyoto', 12:'nara', 13:'kobe', 14:'tokyo'
  };
  return cityMap[dayNum] || 'tokyo';
}

function ctof(c){ return Math.round(c * 9/5 + 32); }

function packingTip(maxTemp, rainProb){
  const tips = [];
  if(maxTemp < 15) tips.push('🧥 Warm jacket essential today');
  else if(maxTemp < 20) tips.push('🧥 Light jacket recommended');
  else tips.push('👕 T-shirt weather — bring a layer for evening');
  if(rainProb > 50) tips.push('☂️ Rain likely — bring umbrella!');
  else if(rainProb > 30) tips.push('☂️ Possible rain — pack umbrella just in case');
  else tips.push('🌞 Low rain chance today');
  return tips.join(' · ');
}

async function fetchWeather(cityKey){
  const city = WEATHER_CITIES[cityKey];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=Asia%2FTokyo&forecast_days=7`;
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('Weather API error');
  return resp.json();
}

async function renderWeather(){
  const wrap = document.getElementById('screen-weather');
  wrap.innerHTML = '';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'banner blue';
  hdr.innerHTML = '<strong>🌤️ Live Weather</strong><br>Real-time forecasts for your trip locations. Auto-selects your current city based on trip day.';
  wrap.appendChild(hdr);

  // City selector
  const cityBar = document.createElement('div');
  cityBar.style.cssText = 'display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;';
  cityBar.innerHTML = '';

  const cities = ['tokyo','hakone','osaka','kyoto','nara','kobe','awaji'];
  const activeCityKey = getTripCity();

  cities.forEach(key => {
    const c = WEATHER_CITIES[key];
    const btn = document.createElement('button');
    btn.style.cssText = `white-space:nowrap;border-radius:20px;padding:5px 12px;font-size:.65rem;font-weight:700;cursor:pointer;flex-shrink:0;border:1.5px solid ${key===activeCityKey?'var(--yellow)':'rgba(255,255,255,.2)'};background:${key===activeCityKey?'rgba(255,215,0,.15)':'transparent'};color:${key===activeCityKey?'var(--yellow)':'rgba(255,255,255,.5)'};`;
    btn.textContent = c.emoji + ' ' + c.name;
    btn.onclick = () => loadWeatherForCity(key, wrap);
    cityBar.appendChild(btn);
  });
  wrap.appendChild(cityBar);

  // Weather content container
  const content = document.createElement('div');
  content.id = 'weather-content';
  wrap.appendChild(content);

  // Load active city
  await loadWeatherForCity(activeCityKey, wrap);
}

async function loadWeatherForCity(cityKey, wrap){
  const content = document.getElementById('weather-content') || wrap;
  const city = WEATHER_CITIES[cityKey];
  content.innerHTML = '';

  // Loading state
  const loading = document.createElement('div');
  loading.style.cssText = 'text-align:center;padding:30px;color:rgba(255,255,255,.5);font-size:.8rem;';
  loading.innerHTML = `<div style="font-size:2rem;margin-bottom:8px;">${city.emoji}</div>Loading ${city.name} weather...`;
  content.appendChild(loading);

  try {
    const data = await fetchWeather(cityKey);
    content.innerHTML = '';

    const daily = data.daily;
    const dates = daily.time;
    const codes = daily.weathercode;
    const maxTemps = daily.temperature_2m_max;
    const minTemps = daily.temperature_2m_min;
    const rainProbs = daily.precipitation_probability_max;
    const winds = daily.windspeed_10m_max;

    // City header with today card
    const cityHdr = document.createElement('div');
    cityHdr.style.cssText = 'background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,215,0,.04));border:1.5px solid rgba(255,215,0,.3);border-radius:14px;padding:14px;margin-bottom:12px;';
    const todayCode = codes[0];
    const todayDesc = WMO_CODES[todayCode] || '🌤️ Unknown';
    const todayMax = maxTemps[0];
    const todayMin = minTemps[0];
    const todayRain = rainProbs[0];

    cityHdr.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div>
          <div style="font-size:1.1rem;font-weight:900;color:var(--yellow);">${city.emoji} ${city.name}</div>
          <div style="font-size:.65rem;color:rgba(255,255,255,.5);">Updated just now · Open-Meteo</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:1.8rem;font-weight:900;color:#fff;">${ctof(todayMax)}°F</div>
          <div style="font-size:.7rem;color:rgba(255,255,255,.5);">Low ${ctof(todayMin)}°F</div>
        </div>
      </div>
      <div style="font-size:.85rem;color:#fff;margin-bottom:6px;">${todayDesc}</div>
      <div style="font-size:.68rem;color:rgba(255,255,255,.6);margin-bottom:8px;">💨 Wind: ${Math.round(winds[0])} km/h · 🌧️ Rain chance: ${todayRain}%</div>
      <div style="background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;font-size:.67rem;color:rgba(255,255,255,.7);line-height:1.5;">${packingTip(todayMax, todayRain)}</div>
    `;
    content.appendChild(cityHdr);

    // Section label
    const lbl = document.createElement('div');
    lbl.className = 'sec';
    lbl.textContent = '7-DAY FORECAST';
    content.appendChild(lbl);

    // 7-day forecast cards
    dates.forEach((dateStr, i) => {
      const date = new Date(dateStr + 'T12:00:00+09:00');
      const dayName = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : date.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
      const desc = WMO_CODES[codes[i]] || '🌤️';
      const rainP = rainProbs[i];

      const card = document.createElement('div');
      card.style.cssText = 'background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(13,27,75,.1);';

      // Rain probability bar color
      const rainColor = rainP > 60 ? '#3b82f6' : rainP > 30 ? '#93c5fd' : '#d1fae5';

      card.innerHTML = `
        <div style="min-width:80px;">
          <div style="font-size:.75rem;font-weight:800;color:#1a1f3a;">${dayName}</div>
          <div style="font-size:.6rem;color:var(--muted);">${dateStr}</div>
        </div>
        <div style="flex:1;font-size:.75rem;color:#1a1f3a;">${desc}</div>
        <div style="text-align:right;min-width:90px;">
          <div style="font-size:.82rem;font-weight:800;color:#1a1f3a;">${ctof(maxTemps[i])}° / ${ctof(minTemps[i])}°</div>
          <div style="display:flex;align-items:center;gap:4px;margin-top:3px;justify-content:flex-end;">
            <div style="width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;">
              <div style="width:${rainP}%;height:100%;background:${rainColor};border-radius:3px;"></div>
            </div>
            <span style="font-size:.6rem;color:var(--muted);">${rainP}%</span>
          </div>
        </div>
      `;
      content.appendChild(card);
    });

    // Packing summary for the week
    const avgMax = maxTemps.reduce((a,b)=>a+b,0)/maxTemps.length;
    const maxRain = Math.max(...rainProbs);

    const packSec = document.createElement('div');
    packSec.className = 'sec';
    packSec.style.marginTop = '14px';
    packSec.textContent = '🎒 PACKING TIPS FOR THIS WEEK';
    content.appendChild(packSec);

    const packCard = document.createElement('div');
    packCard.style.cssText = 'background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(13,27,75,.1);';

    const tips = [
      avgMax < 15 ? '🧥 Pack your warmest layer — it\'s cold this week' : avgMax < 19 ? '🧥 Light jacket needed daily' : '👕 Comfortable t-shirt weather with a jacket for evenings',
      maxRain > 60 ? '☂️ High rain chance — umbrella is essential every day' : maxRain > 30 ? '☂️ Possible rain several days — pack an umbrella' : '🌞 Mostly dry week — umbrella just in case',
      cityKey === 'hakone' ? '🥶 Hakone is cooler than Tokyo — Heattech base layer essential at the lake' : '',
      cityKey === 'kyoto' ? '🌅 Nov 1 Fushimi Inari dawn visit — extra warm layer needed at 6am' : '',
      cityKey === 'awaji' ? '💨 Awaji Island can be windy — light windproof layer recommended' : '',
      '👟 Comfortable walking shoes — expect 15,000+ steps most days',
      '🧴 Sunscreen for DisneySea day even in October',
    ].filter(t => t);

    packCard.innerHTML = tips.map(t => `<div style="font-size:.7rem;color:#1a1f3a;padding:5px 0;border-bottom:1px solid rgba(200,212,248,.3);line-height:1.4;">${t}</div>`).join('');
    content.appendChild(packCard);

    // Refresh button
    const refreshBtn = document.createElement('button');
    refreshBtn.style.cssText = 'width:100%;margin-top:10px;background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--yellow);font-size:.7rem;font-weight:800;padding:9px;border-radius:20px;border:1.5px solid rgba(255,215,0,.3);letter-spacing:.04em;';
    refreshBtn.textContent = '🔄 Refresh Forecast';
    refreshBtn.onclick = () => loadWeatherForCity(cityKey, wrap);
    content.appendChild(refreshBtn);

  } catch(err) {
    content.innerHTML = `
      <div style="background:rgba(204,0,0,.1);border:1.5px solid rgba(204,0,0,.3);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:1.5rem;margin-bottom:8px;">📡</div>
        <div style="font-size:.78rem;font-weight:700;color:#fff;margin-bottom:4px;">Weather unavailable</div>
        <div style="font-size:.67rem;color:rgba(255,255,255,.5);">Connect to WiFi or mobile data to load live forecast</div>
        <button onclick="loadWeatherForCity('${cityKey}',document.getElementById('screen-weather'))" style="margin-top:10px;background:var(--red);color:#fff;font-size:.7rem;font-weight:800;padding:7px 16px;border-radius:20px;border:none;">Try Again</button>
      </div>`;
  }
}

</script>

let currentTranslateTab='basics';
let searchQuery='';

function renderTranslate(){
  const wrap=document.getElementById('screen-translate');
  wrap.innerHTML='';

  // Kid words section
  const kidSec=document.createElement('div');
  kidSec.className='kid-section';
  kidSec.innerHTML=`<div class="kid-section-title">⭐ Fun Words for Kids — Tap to Hear!</div><div style="display:flex;flex-wrap:wrap;">`;
  KID_WORDS.forEach(w=>{
    const el=document.createElement('div');
    el.className='kid-word';
    el.innerHTML=`<span class="kid-emoji">${w.emoji}</span><span class="kid-jp">${w.jp}</span><span class="kid-en">${w.en}</span>`;
    el.onclick=()=>{
      // Try text-to-speech
      if('speechSynthesis' in window){
        const utt=new SpeechSynthesisUtterance(w.jp);
        utt.lang='ja-JP'; utt.rate=0.8;
        speechSynthesis.speak(utt);
      }
      showToast(`${w.emoji} ${w.jp} = ${w.en}`);
    };
    kidSec.querySelector('div:last-child').appendChild(el);
  });
  wrap.appendChild(kidSec);

  // Search
  const search=document.createElement('input');
  search.className='translate-search';
  search.placeholder='🔍 Search phrases...';
  search.value=searchQuery;
  search.oninput=(e)=>{ searchQuery=e.target.value; renderTranslateContent(wrap, searchQuery); };
  wrap.appendChild(search);

  // Category tabs
  const tabs=document.createElement('div');
  tabs.className='translate-tabs';
  const cats=[
    {key:'basics', label:'👋 Basics'},
    {key:'restaurant', label:'🍜 Restaurant'},
    {key:'transport', label:'🚆 Transport'},
    {key:'shopping', label:'🛍️ Shopping'},
    {key:'emergency', label:'🆘 Emergency'},
    {key:'kids', label:'⭐ Kids'},
  ];
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='ttab'+(currentTranslateTab===cat.key?' on':'');
    btn.textContent=cat.label;
    btn.onclick=()=>{ currentTranslateTab=cat.key; searchQuery=''; search.value=''; renderTranslate(); };
    tabs.appendChild(btn);
  });
  wrap.appendChild(tabs);

  // Phrases container
  const container=document.createElement('div');
  container.id='translate-content';
  wrap.appendChild(container);
  renderTranslateContent(container, searchQuery);
}

function renderTranslateContent(container, query){
  const el=document.getElementById('translate-content')||container;
  el.innerHTML='';

  let phrases=query
    ? Object.values(PHRASES).flat().filter(p=>
        p.en.toLowerCase().includes(query.toLowerCase())||
        p.rom.toLowerCase().includes(query.toLowerCase()))
    : PHRASES[currentTranslateTab]||[];

  if(phrases.length===0){
    el.innerHTML=`<div style="text-align:center;padding:20px;color:rgba(255,255,255,.4);font-size:.75rem;">No phrases found</div>`;
    return;
  }

  phrases.forEach((phrase,i)=>{
    const card=document.createElement('div');
    card.className='phrase-card';
    card.id=`phrase-${i}`;
    card.innerHTML=`
      <span class="phrase-copy" onclick="copyPhrase(event,'${phrase.jp}',${i})">COPY</span>
      <div class="phrase-en">${phrase.en}</div>
      <div class="phrase-jp">${phrase.jp}</div>
      <div class="phrase-rom">${phrase.rom}</div>
    `;
    card.onclick=()=>{
      if('speechSynthesis' in window){
        const utt=new SpeechSynthesisUtterance(phrase.jp);
        utt.lang='ja-JP'; utt.rate=0.75;
        speechSynthesis.speak(utt);
      }
    };
    el.appendChild(card);
  });
}

function copyPhrase(e, text, idx){
  e.stopPropagation();
  if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
  const card=document.getElementById(`phrase-${idx}`);
  if(card){
    card.classList.add('copied');
    card.querySelector('.phrase-copy').textContent='✓ COPIED';
    setTimeout(()=>{ card.classList.remove('copied'); card.querySelector('.phrase-copy').textContent='COPY'; }, 2000);
  }
  showToast('📋 Copied to clipboard!');
}

const TOKEN_RE=/⟦([A-Z0-9_]+)⟧/g;
function replaceTokens(s,map){ return s.replace(TOKEN_RE,(m,k)=>(map&&map[k]!==undefined)?map[k]:'🔒'); }
function deepReplace(o,map,seen){
  seen=seen||new Set();
  if(!o||typeof o!=='object'||seen.has(o)) return;
  seen.add(o);
  for(const k of Object.keys(o)){
    const v=o[k];
    if(typeof v==='string'){ if(v.indexOf('⟦')>-1) o[k]=replaceTokens(v,map); }
    else if(v&&typeof v==='object') deepReplace(v,map,seen);
  }
}

      }
    }
    return {ok:false,msg:'That passcode is not right'};
  },
  apply(role,secrets){
    ROLE=role;
    document.body.dataset.role=role;
    const map=secrets||{};
    [DAYS,ALERTS,BOOKABLE_ITEMS,HOTELS,FLIGHT_CARDS,TRANSPORT,LINKS,DRIVE].forEach(o=>deepReplace(o,map));
    const ov=document.getElementById('authOverlay'); if(ov) ov.classList.add('hidden');
    const pill=document.getElementById('rolePill'); if(pill) pill.textContent=role==='family'?'👀 VIEW ONLY':'🧢 TRAVELER';
    if(typeof afterUnlock==='function') afterUnlock();
  },
  lock(){ try{ localStorage.removeItem('japan2026_session'); }catch(e){} location.reload(); },
  init(){
    try{
      const s=JSON.parse(localStorage.getItem('japan2026_session')||'null');
      if(s && s.role && AUTH_BLOBS && s.v===AUTH_BLOBS.v){ this.apply(s.role,s.secrets); return; }
    }catch(e){}
    const ov=document.getElementById('authOverlay'); if(ov) ov.classList.remove('hidden');
  }
};

/* ── tickets: aliases, merged view, which day an item sits on ── */
function canonKey(k){ return TICKET_ALIAS[k]||k; }
function itemByKey(k){ const c=canonKey(k); return BOOKABLE_ITEMS.find(i=>i.key===c); }
function aliasesOf(c){ return [c].concat(Object.keys(TICKET_ALIAS).filter(a=>TICKET_ALIAS[a]===c)); }
function ticketView(key){
  const c=canonKey(key), item=itemByKey(c)||{}, t=STATE.tickets[c]||{};
  const user=!!t.confirmation;
  return {
    item, user,
    booked: user||!!item.confirmed,
    pending: t.status==='pending',
    confirmation: t.confirmation||item.confirmation||'',
    timeLabel: t.time?(t.date?t.date+' · ':'')+t.time:(item.timeLabel||''),
    date:t.date||'', time:t.time||'', adults:t.adults||'', children:t.children||'', notes:t.notes||''
  };
}
function dayOfKey(key){
  const set=aliasesOf(canonKey(key));
  for(const d of DAYS){ if(d.stops.some(s=>s.ticketKey&&set.includes(s.ticketKey))) return d.day; }
  return null;
}
function migrateTickets(){
  /* carry anything you already checked off under an old duplicate key over to its canonical key — never delete */
  let changed=false;
  Object.keys(TICKET_ALIAS).forEach(a=>{
    const c=TICKET_ALIAS[a], from=STATE.tickets[a];
    if(from&&from.confirmation&&!(STATE.tickets[c]&&STATE.tickets[c].confirmation)){ STATE.tickets[c]=Object.assign({},from); changed=true; }
  });
  if(changed){ try{ saveTickets(); }catch(e){} }
}
function loadTickets(){
  try{ const raw=localStorage.getItem('japan2026_tickets'); STATE.tickets=raw?JSON.parse(raw):{}; }catch(e){ STATE.tickets={}; }
  migrateTickets();
}

BOOKABLE_ITEMS.forEach(i=>{
  const p=BOOKABLE_PATCH[i.key]; if(p) Object.assign(i,p);
  if(TICKET_ALIAS[i.key]) i.alias=TICKET_ALIAS[i.key];
});
BOOKABLE_EXTRA.forEach(x=>{ if(!BOOKABLE_ITEMS.find(i=>i.key===x.key)) BOOKABLE_ITEMS.push(x); });
QUESTS.forEach(q=>{ const p=QUEST_PATCH[q.id]; if(p) Object.assign(q,p); });

BOOKABLE_ITEMS.forEach(i=>{ const d=dayOfKey(i.key); if(d) i.day=d; else if(!i.alias) i.day=null; });

function currentTripDay(){
  const t=new Date(), ymd=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const d=DAYS.find(x=>x.dateObj===ymd); return d?d.day:null;
}
function getBookedTicketsForDay(dayNum){
  const d=DAYS.find(x=>x.day===dayNum), seen=new Set(), out=[];
  (d?d.stops:[]).forEach(s=>{
    if(!s.ticketKey) return;
    const c=canonKey(s.ticketKey); if(seen.has(c)) return; seen.add(c);
    const v=ticketView(c);
    if(v.booked&&v.item.name) out.push({name:v.item.name,icon:v.item.icon||'🎟',time:v.timeLabel,status:v.pending?'pending':'booked'});
  });
  return out;
}

const MAP_COLORS={flight:'#6366f1',hotel:'#ffd700',ticket:'#22c55e',stop:'#60a5fa'};
function mapPoints(){
  const pts=[], seen=new Set();
  const inJapan=(la,ln)=>la>24&&la<46&&ln>122&&ln<146;
  DAYS.forEach(d=>d.stops.forEach(s=>{
    if(!s.lat||!inJapan(s.lat,s.lng)) return;
    const k=s.name+s.lat; if(seen.has(k)) return; seen.add(k);
    const booked=s.ticketKey?ticketView(s.ticketKey).booked:false;
    pts.push({name:s.name.replace(/\s*\(optional\)/i,''),lat:s.lat,lng:s.lng,day:d.day,date:d.date,city:d.city,booked,kind:booked?'ticket':'stop'});
  }));
  HOTELS.forEach(h=>{
    if(!inJapan(h.lat,h.lng)) return;
    const k='H'+h.name; if(seen.has(k)) return; seen.add(k);
    pts.push({name:h.name,lat:h.lat,lng:h.lng,day:null,date:h.nights,city:null,booked:h.status==='booked',kind:'hotel'});
  });
  return pts;
}

function loadLocalGallery(){

      /* older builds saved photos under another key — fold them in once so nothing is lost */

function imageToBlob(file,maxW,q,asDataUrl){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=ev=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const s=Math.min(1,maxW/img.width), c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        if(asDataUrl) res(c.toDataURL('image/jpeg',q)); else c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function addGalleryPhoto(dayNum){ addGalleryMedia(dayNum); }
function addGalleryMedia(dayNum){
  if(!canEdit()){ viewOnlyToast(); return; }
  const input=document.createElement('input'); input.type='file'; input.accept='image/*,video/*'; input.multiple=true;
  input.onchange=async e=>{
    const files=Array.from(e.target.files||[]); if(!files.length) return;
    const shared=!!(window.FB&&FB.ready&&FB.mediaReady); let ok=0, skipped=0;
    for(const f of files){
      try{
        if(f.type.startsWith('video/')){
          if(!shared){ skipped++; continue; }
          showToast('⬆️ Uploading video…',4000);
          if(await FB.uploadMedia(dayNum,f,'video')) ok++;
        }else{
          if(shared){
            try{ const big=await imageToBlob(f,1600,.82,false); if(await FB.uploadMedia(dayNum,big,'image')){ ok++; continue; } }catch(err){}
          }
          const small=await imageToBlob(f,600,.7,true), g=loadLocalGallery();
          g[dayNum]=g[dayNum]||{imgs:[],note:''}; g[dayNum].imgs.push(small); saveLocalGallery(g); ok++;
        }
      }catch(err){ skipped++; }
    }
    showToast(ok?('📸 '+ok+' saved'+(shared?' & shared':'')):'Nothing was saved');
    if(skipped&&!shared) setTimeout(()=>showToast('Videos go in the Drive folder (top of this page)',3500),1800);
    renderGallery();
  };
  input.click();
}

let LEDGER={items:[],settings:{travelers:3,rate:FX_RATE,planned:0,rates:{}}};

function loadLedger(){
  try{ const raw=JSON.parse(localStorage.getItem('japan2026_ledger')||'null'); if(raw&&raw.items) LEDGER={items:raw.items,settings:Object.assign({travelers:3,rate:FX_RATE,planned:0,rates:{}},raw.settings||{})}; }catch(e){}
}
function saveLedger(){ try{ localStorage.setItem('japan2026_ledger',JSON.stringify(LEDGER)); }catch(e){} }
function catRate(id){ const s=LEDGER.settings.rates||{}; if(s[id]!=null) return +s[id]; const c=LEDGER_CATS.find(x=>x.id===id); return c?c.rate:5; }
const money=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function computeDuty(){
  const S=LEDGER.settings, n=Math.max(1,parseInt(S.travelers)||1);
  const lines=LEDGER.items.map(it=>({usd:+it.usd||0,cat:it.cat,rate:catRate(it.cat)}));
  if((+S.planned)>0) lines.push({usd:+S.planned,cat:'other',rate:catRate('other'),planned:true});
  const total=lines.reduce((a,l)=>a+l.usd,0);
  const exemption=800*n, flatSize=1000*n;
  /* worst case: the exemption and the 3% flat bracket are applied to the highest-duty items first */
  const sorted=lines.map(l=>Object.assign({},l)).sort((a,b)=>b.rate-a.rate);
  let ex=exemption, flat=flatSize, flatAmt=0; const rest=[];
  sorted.forEach(l=>{
    let u=l.usd; const a=Math.min(u,ex); ex-=a; u-=a;
    const b=Math.min(u,flat); flat-=b; u-=b; flatAmt+=b;
    if(u>0) rest.push({cat:l.cat,rate:l.rate,usd:u});
  });
  const restDuty=rest.reduce((a,l)=>a+l.usd*l.rate/100,0), flatDuty=flatAmt*0.03, duty=flatDuty+restDuty;
  const byCat={}; lines.forEach(l=>{ byCat[l.cat]=(byCat[l.cat]||0)+l.usd; });
  return {n,total,exemption,flatSize,flatAmt,flatDuty,restAmt:rest.reduce((a,l)=>a+l.usd,0),restDuty,duty,room:Math.max(0,exemption-total),byCat};
}
